name: QUADLUD Tango cognitive R8 full cache
# Exact synchronized DAG-cache rebuild. Build results are recomputed at merge if artifact transport fails.

on:
  push:
    branches: [candidate/v3.1.9-tango-cognitive-chunks-r1]
    paths:
      - '.github/workflows/tango-cognitive-cache-full.yml'
      - 'difficulty-rating.js'
      - 'tango-logic.js'
      - 'tango-difficulty.js'
      - 'tutor-move-selector.js'
      - 'pedagogy-next-move-policy.js'
      - 'tango-played-move-planner.js'
      - 'tango-attention-continuity-bridge.js'
      - 'tango-tutor-frontier-pruner-r5.js'
      - 'tango-played-move-runtime.js'
      - 'tango-human-cost-bridge.js'
      - 'cognitive-cost.js'
      - 'tango-cognitive-patterns.js'
      - 'tango-cognitive-pedagogy-bridge.js'
      - 'tango-human-pedagogy-r4.js'
      - 'tango-cognitive-proof-stages-bridge.js'
      - 'tango-direct-visible-priority-bridge.js'
      - 'tango-tutor-single-planner-r5.js'
      - 'tango-runtime-pool-data.js'
      - 'tango-tutor-precomputed-cache.js'
      - 'qa-public/tools/tango_tutor_cache_contract.js'
      - 'qa-public/tools/materialize_tango_tutor_cognitive_contract.js'
      - 'qa-public/tools/build_tango_tutor_sync_shard_r8.js'
      - 'qa-public/tools/merge_tango_tutor_cognitive_slices.js'
      - 'qa-public/tools/compact_tango_tutor_sync_r8.js'
      - 'qa-public/tools/tango_materialized_dag.js'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      parity: ${{ steps.matrix.outputs.parity }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          build=[]
          # Larger bounded slices reduce artifact-service fan-out while staying well inside runner limits.
          for diff,count in [('easy',20),('medium',20),('hard',10),('expert',4)]:
              for start in range(0,120,count):
                  build.append({'difficulty':diff,'start':start,'count':min(count,120-start)})
          parity=[]
          for diff,count in [('easy',20),('medium',20),('hard',20),('expert',4)]:
              for start in range(0,120,count):
                  parity.append({'difficulty':diff,'start':start,'count':min(count,120-start)})
          print('build='+json.dumps({'include':build},separators=(',',':')))
          print('parity='+json.dumps({'include':parity},separators=(',',':')))
          PY

  build-slices:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Build bounded cognitive Tutor slice
        run: |
          set -euo pipefail
          mkdir -p out
          NAME="tango-tutor-sync-${{ matrix.difficulty }}-${{ matrix.start }}-${{ matrix.count }}"
          node qa-public/tools/build_tango_tutor_sync_shard_r8.js \
            --difficulty '${{ matrix.difficulty }}' --start '${{ matrix.start }}' --count '${{ matrix.count }}' \
            --output "out/${NAME}.json" --report "out/${NAME}-report.json"
      - id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cog-slice-${{ matrix.difficulty }}-${{ matrix.start }}
          path: out/*
          retention-days: 7
      - name: Record recoverable artifact transport failure
        if: steps.upload.outcome == 'failure'
        run: echo 'WARN artifact upload failed after successful slice build; merge-cache will rebuild this exact slice.'

  merge-cache:
    needs: [plan,build-slices]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: cog-slice-*
          path: slices
          merge-multiple: true
      - name: Recover any missing exact slice, merge and compact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p slices merged compact
          recover_range() {
            local diff="$1" count="$2" start name
            for ((start=0; start<120; start+=count)); do
              name="tango-tutor-sync-${diff}-${start}-${count}"
              if [ ! -s "slices/${name}.json" ]; then
                echo "RECOVER ${diff} ${start}+${count}: artifact absent; rebuilding exact source slice"
                node qa-public/tools/build_tango_tutor_sync_shard_r8.js \
                  --difficulty "$diff" --start "$start" --count "$count" \
                  --output "slices/${name}.json" --report "slices/${name}-report.json"
              fi
              test -s "slices/${name}.json"
            done
          }
          recover_range easy 20
          recover_range medium 20
          recover_range hard 10
          recover_range expert 4
          node --check qa-public/tools/tango_materialized_dag.js
          node --check qa-public/tools/merge_tango_tutor_cognitive_slices.js
          node --check qa-public/tools/compact_tango_tutor_sync_r8.js
          node qa-public/tests/v319-r8-materialized-dag.test.js
          for d in easy medium hard expert; do
            node qa-public/tools/merge_tango_tutor_cognitive_slices.js slices "$d" "merged/tango-tutor-sync-$d.json"
          done
          node qa-public/tools/compact_tango_tutor_sync_r8.js merged compact
          node qa-public/tools/materialize_tango_tutor_cognitive_contract.js compact/tango-tutor-cache-contract-r8.js
          cp merged/*.json compact/
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert'),crypto=require('crypto');
          const dataPath='compact/tango-tutor-cache-data-r8.js',report=JSON.parse(fs.readFileSync('compact/tango-tutor-cache-r8-sync-report.json'));
          assert.strictEqual(report.schema,4);assert.strictEqual(report.version,'tango-tutor-cache-r8-sync4-cognitive-dag');
          assert.deepStrictEqual(report.puzzles,{easy:120,medium:120,hard:120,expert:120});assert.strictEqual(report.totalSteps,14861);assert.strictEqual(report.materializedDeductions,427);
          assert.strictEqual(report.tutorContract.version,2);assert.strictEqual(report.cognitiveModel,'quadlud-cognitive-load-v1');assert.strictEqual(report.cognitivePatternCatalog,'tango-cognitive-patterns-v1');
          assert(report.materializedPackedBytes<2500000,`materialized DAG unexpectedly large: ${report.materializedPackedBytes}`);assert(report.materializedReductionPct>90,`materialized DAG reduction regressed: ${report.materializedReductionPct}%`);assert(report.bytes<6000000,`final cache unexpectedly large: ${report.bytes}`);
          const sha=crypto.createHash('sha256').update(fs.readFileSync(dataPath)).digest('hex');fs.writeFileSync('compact/cache-sha256.txt',`${sha}  tango-tutor-cache-data-r8.js\n`);console.log('COMPACT_DAG_PASS',JSON.stringify(report),'sha256',sha)
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cognitive-r8-cache-full
          path: compact/*
          retention-days: 14

  parity:
    needs: [plan,merge-cache]
    strategy:
      fail-fast: false
      max-parallel: 24
      matrix: ${{ fromJSON(needs.plan.outputs.parity) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: cognitive-r8-cache-full
          path: certified
      - name: Install generated DAG cache + exact runtime contract for parity
        run: |
          cp certified/tango-tutor-cache-data-r8.js ./tango-tutor-cache-data-r8.js
          cp certified/tango-tutor-cache-contract-r8.js ./tango-tutor-cache-contract-r8.js
          node --check tango-tutor-precomputed-cache.js
          node --check tango-tutor-cache-data-r8.js
      - name: Run exact cognitive cache/live parity slice
        env:
          QUADLUD_PARITY_DIFFICULTY: ${{ matrix.difficulty }}
          QUADLUD_PARITY_START: ${{ matrix.start }}
          QUADLUD_PARITY_COUNT: ${{ matrix.count }}
        run: node qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js

  certify:
    needs: [merge-cache,parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cognitive-r8-cache-full
          path: certified
      - name: Final certification marker
        run: |
          set -euo pipefail
          cat certified/cache-sha256.txt
          echo 'COGNITIVE_R8_DAG_CACHE_PARITY_PASS: 480 puzzles, 14861 canonical visible states, 100% exact cache/live parity.' | tee certified/CERTIFIED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cognitive-r8-cache-certified
          path: certified/*
          retention-days: 30

  install-cache:
    needs: [merge-cache,parity,certify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: cognitive-r8-cache-full
          path: certified
      - name: Install certified exact-source DAG cache and bump browser cache keys
        shell: bash
        run: |
          set -euo pipefail
          cp certified/tango-tutor-cache-data-r8.js ./tango-tutor-cache-data-r8.js
          cp certified/tango-tutor-cache-contract-r8.js ./tango-tutor-cache-contract-r8.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','sw.js']:
              p=Path(name); text=p.read_text()
              text=text.replace('3.1.9-r8-sync3-cognitive','3.1.9-r8-sync4-cognitive-dag')
              text=text.replace('3.1.9-cognitive-r3-bounded-relation-fallback','3.1.9-cognitive-r4-cache-contract-guard')
              if name=='sw.js':
                  text=text.replace('quadlud-v3.1.9-tango-r8-sync3-cognitive-v21','quadlud-v3.1.9-tango-r8-sync4-cognitive-dag-v22')
              p.write_text(text)
          PY
          node --check tango-tutor-single-planner-r5.js
          node --check tango-tutor-cache-contract-r8.js
          node --check tango-tutor-precomputed-cache.js
          node --check tango-tutor-cache-data-r8.js
          node qa-public/tests/v319-r8-materialized-dag.test.js
          node qa-public/tests/v319-r8-cache-planner-contract-guard.test.js
          node qa-public/tests/v319-r3ui-tango-tutor-single-planner-owner.test.js
          node qa-public/tests/v319-r8-cognitive-live-priority.test.js
          node qa-public/tests/v319-r8-simple-before-contradiction.test.js
          git diff --check
      - name: Commit exact certified DAG cache integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-tutor-cache-data-r8.js tango-tutor-cache-contract-r8.js index.html sw.js
          if git diff --cached --quiet; then
            echo 'Certified DAG cache already installed.'
            exit 0
          fi
          git commit -m 'build(tango): install certified cognitive R8 DAG cache'
          git push origin HEAD:candidate/v3.1.9-tango-cognitive-chunks-r1
