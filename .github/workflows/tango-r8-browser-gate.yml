name: QUADLUD integrated exact R8 browser gate
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths:
      - '.github/workflows/tango-r8-browser-gate.yml'
      - 'sw.js'
      - 'index.html'
      - 'tango-runtime-pool-data.js'
      - 'tango-tutor-cache-data-r8.js'
      - 'tango-precomputed-pool-runtime.js'
      - 'tango-tutor-precomputed-cache.js'
      - 'tango-tutor-single-planner-r5.js'
      - 'tango-semantic-coherence-hf39.js'
      - 'tango-tutor-human-regression-r54.js'
      - 'tango-tutor-causal-atomic-r55.js'
      - 'tango-pedagogy-text-finalizer.js'
      - 'qa-public/tests/v319-hf39-r54-tutor-presentation.test.js'
      - 'qa-public/tests/v319-hf39-r55-internal-action-continuity.test.js'
      - 'qa-public/tests/v319-r3ui-tango-text-finalizer.test.js'
      - 'qa-public/tests/v319-semantic-tango-tutor-journey-browser.test.py'
      - 'qa-public/tests/v319-r8-integrated-browser.test.py'
      - 'qa-public/tests/v319-r8-browser-phase-diagnostic.py'
      - 'qa-public/tests/v319-r8-service-worker-minimal-probe.py'
permissions:
  contents: read
jobs:
  browser-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/quadlud-r8-browser"
          rm -rf "$R"; mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          printf '<!doctype html><html><body>SW probe</body></html>\n' > "$R/GitHub/qa-sw-probe.html"
          test -f "$R/GitHub/LICENSE"
          test -f "$R/GitHub/tango-runtime-pool-data.js"
          test -f "$R/GitHub/tango-tutor-cache-data-r8.js"
          test -f "$R/tests/v319-r8-integrated-browser.test.py"
          test -f "$R/tests/v319-r8-browser-phase-diagnostic.py"
          test -f "$R/tests/v319-r8-service-worker-minimal-probe.py"
          test -f "$R/tests/v319-hf39-r54-tutor-presentation.test.js"
          test -f "$R/tests/v319-hf39-r55-internal-action-continuity.test.js"
          test -f "$R/tests/v319-r3ui-tango-text-finalizer.test.js"
      - name: Probe service worker on minimal page
        env:
          QUADLUD_R8_BASE_URL: http://127.0.0.1:8765/
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/quadlud-r8-browser"
          cd "$R/GitHub"
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/r8-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/qa-sw-probe.html >/dev/null && break; sleep 1; done
          cd "$R"; export PYTHONPATH="$R/tests"
          timeout 30s python3 -u tests/v319-r8-service-worker-minimal-probe.py
      - name: Diagnose real-page phase boundaries
        env:
          QUADLUD_R8_BASE_URL: http://127.0.0.1:8765/
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/quadlud-r8-browser"
          cd "$R/GitHub"
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/r8-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          cd "$R"; export PYTHONPATH="$R/tests"
          timeout 90s python3 -u tests/v319-r8-browser-phase-diagnostic.py
      - name: Run real-page exact R8 integration gate
        env:
          QUADLUD_R8_BASE_URL: http://127.0.0.1:8765/
          QUADLUD_R8_BROWSER_REPORT: ${{ runner.temp }}/r8-evidence/integrated-browser.json
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/quadlud-r8-browser"
          mkdir -p "$RUNNER_TEMP/r8-evidence"
          cd "$R/GitHub"
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/r8-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          cd "$R"; export PYTHONPATH="$R/tests"
          timeout 420s python3 -u tests/v319-r8-integrated-browser.test.py
      - name: Run integrated semantic browser regressions
        env:
          QUADLUD_ATTENTION_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/attention
          QUADLUD_CONTRADICTION_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/contradiction
          QUADLUD_VISUAL_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/visual
          QUADLUD_TUTOR_CLARITY_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/clarity
          QUADLUD_SEMANTIC_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/expert
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/quadlud-r8-browser"; cd "$R"; export PYTHONPATH="$R/tests"
          node tests/v319-r3ui-tango-text-finalizer.test.js
          node tests/v319-hf39-r54-tutor-presentation.test.js
          node tests/v319-hf39-r55-internal-action-continuity.test.js
          node tests/v319-hf39-semantic-coherence.test.js
          node tests/v319-hf39-r55-stage-order.test.js
          python3 tests/v319-r3ui-tango-attention-continuity-browser.test.py
          python3 tests/v319-r3ui-tango-contradiction-visual-browser.test.py
          python3 tests/v319-r3ui-pedagogy-visual-hierarchy-browser.test.py
          python3 tests/v319-r3ui-tango-tutor-clarity-browser.test.py
          python3 tests/v319-semantic-tango-tutor-journey-browser.test.py
      - name: Audit Expert hypothetical marker uniqueness
        env:
          QUADLUD_SEMANTIC_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/expert
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, re
          root=os.environ['QUADLUD_SEMANTIC_EVIDENCE_DIR']
          bad=[]; checked=0
          for path in sorted(glob.glob(os.path.join(root,'steps','*.json'))):
              with open(path,encoding='utf-8') as fh: data=json.load(fh)
              for cell in data.get('board',{}).get('cells',[]):
                  cls=str(cell.get('className',''))
                  if 'hf39-hypothesis-cell' not in cls and 'hf39-hypothetical-cell' not in cls:
                      continue
                  checked += 1
                  text=str(cell.get('text',''))
                  glyphs=len(re.findall(r'[☀☾]',text))
                  if glyphs != 1:
                      bad.append({'file':os.path.basename(path),'row':cell.get('row'),'column':cell.get('column'),'text':text,'glyphs':glyphs,'className':cls})
          if bad:
              raise SystemExit('duplicate/missing hypothetical glyphs: '+json.dumps(bad[:20],ensure_ascii=False))
          print(f'PASS Expert evidence: {checked} hypothetical cell observations each contain exactly one glyph.')
          PY
      - name: Audit Expert final contradiction text and French localization
        env:
          QUADLUD_SEMANTIC_EVIDENCE_DIR: ${{ runner.temp }}/r8-evidence/expert
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, re
          root=os.environ['QUADLUD_SEMANTIC_EVIDENCE_DIR']
          bad=[]; contradiction_actions=0; captures=0
          raw_english=re.compile(r'\b(?:sun|moon|suns|moons)\b',re.I)
          duplicate_final=re.compile(r'\bDonc\s+[A-F][1-6]\s*=.*?Coup conseillé\s*:',re.I|re.S)
          for path in sorted(glob.glob(os.path.join(root,'steps','*.json'))):
              with open(path,encoding='utf-8') as fh: data=json.load(fh)
              captures += 1
              text=str(data.get('visibleExplanation',''))
              if raw_english.search(text) or re.search(r'Conclusion intermédiaire',text,re.I):
                  bad.append({'file':os.path.basename(path),'kind':'localization/dedup','text':text})
              move=data.get('currentMove') or {}
              deduction=move.get('deduction') or {}
              if move.get('stageKind')=='action' and deduction.get('rule')=='ASSUMPTION_CONTRADICTION':
                  contradiction_actions += 1
                  if duplicate_final.search(text) or re.search(r'\bDonc\s+[A-F][1-6]\s*=',text,re.I):
                      bad.append({'file':os.path.basename(path),'kind':'duplicate-final-conclusion','text':text})
                  if text.count('Coup conseillé') != 1:
                      bad.append({'file':os.path.basename(path),'kind':'missing-or-duplicate-advice','text':text})
          if contradiction_actions != 5:
              bad.append({'kind':'unexpected-contradiction-action-count','count':contradiction_actions})
          if bad:
              raise SystemExit('Expert text audit failed: '+json.dumps(bad[:20],ensure_ascii=False))
          print(f'PASS Expert text audit: {captures} captures, {contradiction_actions} final contradiction actions, French-only and no duplicate final conclusion.')
          PY
      - name: Upload integrated R8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango-r8-integrated-browser-evidence
          path: ${{ runner.temp }}/r8-evidence
          if-no-files-found: warn
          retention-days: 14
