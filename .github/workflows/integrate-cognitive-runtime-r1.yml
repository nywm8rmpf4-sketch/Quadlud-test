name: QUADLUD integrate cognitive runtime R1
on:
  push:
    branches: [candidate/v3.1.9-tango-cognitive-chunks-r1]
    paths: ['.github/workflows/integrate-cognitive-runtime-r1.yml']
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v3.1.9-tango-cognitive-chunks-r1}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Patch browser load order and PWA cache
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          old='<script src="tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d"></script><script src="tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5"></script><script src="tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract"></script><script src="tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d"></script><script src="tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync2-7d"></script><script src="tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync2-7d"></script>'
          new='<script src="tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d"></script><script src="tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5"></script><script src="cognitive-cost.js?v=3.1.9-cognitive-v1"></script><script src="tango-cognitive-patterns.js?v=3.1.9-cognitive-patterns-v1"></script><script src="tango-cognitive-pedagogy-bridge.js?v=3.1.9-cognitive-ranking-r1"></script><script src="tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract"></script><script src="tango-cognitive-proof-stages-bridge.js?v=3.1.9-cognitive-stages-r1"></script><script src="tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync3-cognitive"></script><script src="tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync3-cognitive"></script><script src="tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync3-cognitive"></script>'
          if s.count(old)!=1: raise SystemExit('index cognitive load-order anchor mismatch')
          p.write_text(s.replace(old,new),encoding='utf-8')
          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          s=s.replace("const CACHE='quadlud-v3.1.9-tango-r8-sync2-7d-v18';","const CACHE='quadlud-v3.1.9-tango-r8-sync3-cognitive-v19';")
          old="'./tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d','./tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5','./tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract','./tango-tutor-single-planner-r5.js?v=3.1.9-hf3.9-r5.1b-single-planner-v3-precomputed-guarded'"
          new="'./tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d','./tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5','./cognitive-cost.js?v=3.1.9-cognitive-v1','./tango-cognitive-patterns.js?v=3.1.9-cognitive-patterns-v1','./tango-cognitive-pedagogy-bridge.js?v=3.1.9-cognitive-ranking-r1','./tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract','./tango-cognitive-proof-stages-bridge.js?v=3.1.9-cognitive-stages-r1','./tango-tutor-single-planner-r5.js?v=3.1.9-hf3.9-r5.1b-single-planner-v3-precomputed-guarded'"
          if s.count(old)!=1: raise SystemExit('sw cognitive load-order anchor mismatch')
          s=s.replace(old,new)
          s=s.replace("'./tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d','./tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync2-7d','./tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync2-7d'","'./tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync3-cognitive','./tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync3-cognitive','./tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync3-cognitive'")
          p.write_text(s,encoding='utf-8')
          PY
          for f in cognitive-cost.js tango-cognitive-patterns.js tango-cognitive-pedagogy-bridge.js tango-cognitive-proof-stages-bridge.js tango-tutor-precomputed-cache.js; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert'),vm=require('vm');const s=fs.readFileSync('sw.js','utf8');const m=/const ASSETS=(\[[\s\S]*?\]);/.exec(s);assert(m);const assets=vm.runInNewContext(m[1]);assert.equal(assets.length,new Set(assets).size);for(const name of ['cognitive-cost.js','tango-cognitive-patterns.js','tango-cognitive-pedagogy-bridge.js','tango-cognitive-proof-stages-bridge.js'])assert(assets.some(x=>x.includes(name)),name);assert(s.includes('sync3-cognitive-v19'));console.log('PWA_COGNITIVE_ASSETS_PASS',assets.length)
          NODE
          git diff --check
      - name: Commit browser integration
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot';git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'feat(tango): load cognitive Tutor model in browser runtime'
          git push origin HEAD:candidate/v3.1.9-tango-cognitive-chunks-r1
