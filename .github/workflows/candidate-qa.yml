# HF3.9 semantic candidate gate
name: QUADLUD v3.1.9 HF3.9 candidate QA
on:
  push:
    branches: [candidate/v3.1.9-r3ui-unit-context-r2, candidate/v3.1.9-hf3.9-semantic-r1, candidate/v3.1.9-hf3.9-r5.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quadlud-v319-hf39-candidate
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public/private boundary
        run: python3 qa-public/tests/public_runtime_guard.py
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install browser QA environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize canonical QA layout
        run: |
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"; rm -rf "$QA_ROOT"; mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/tests"
          rsync -a ./ "$QA_ROOT/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='qa-public/' --exclude='qa-release/' --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/tests/"
      - name: Check runtime JavaScript syntax
        run: find "$RUNNER_TEMP/quadlud-public-qa/GitHub" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Gate all public JavaScript suites
        run: |
          cd "$RUNNER_TEMP/quadlud-public-qa"
          for test in tests/*.test.js; do echo "JS $test"; node "$test"; done
      - name: Gate all public browser and Python suites
        run: |
          cd "$RUNNER_TEMP/quadlud-public-qa"; export PYTHONPATH="$PWD/tests"
          for test in tests/*.test.py; do echo "PY $test"; python "$test"; done
      - name: Preserve Tango Tutor semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v319-tango-tutor-semantic-evidence-${{ github.run_number }}
          path: /tmp/quadlud-semantic-evidence/tango-expert-fr-mobile-v1
          if-no-files-found: warn
          retention-days: 7
