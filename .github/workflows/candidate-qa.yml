name: QUADLUD v3.1.9 HF3.9 candidate QA

on:
  push:
    branches: [candidate/v3.1.9-r3ui-unit-context-r2, candidate/v3.1.9-hf3.9-semantic-r1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadlud-v319-hf39-candidate
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Enforce public/private boundary
        run: python3 qa-public/tests/public_runtime_guard.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"
          rm -rf "$QA_ROOT"
          mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/tests"
          rsync -a ./ "$QA_ROOT/GitHub/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='qa-release/' \
            --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/tests/"
          test -f "$QA_ROOT/GitHub/index.html"

      - name: Check runtime JavaScript syntax
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/quadlud-public-qa/GitHub" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Gate R3UI semantic hierarchy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          node tests/v319-r3ui-pedagogy-visual-hierarchy.test.js

      - name: Gate v3.1.9 Soleil-Lune logic and proof regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          while IFS= read -r test; do
            echo "TANGO V319 JS: $test"
            node "$test"
          done < <(find tests -maxdepth 1 -type f \( -name 'v319-a13*.test.js' -o -name 'v319-r3ui-tango-*.test.js' \) | sort)

      - name: Gate remaining public JavaScript suites
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          while IFS= read -r test; do
            case "$test" in
              *v319-r3ui-pedagogy-visual-hierarchy.test.js|*v319-a13*.test.js|*v319-r3ui-tango-*.test.js) continue ;;
            esac
            echo "OTHER PUBLIC QA JS: $test"
            node "$test"
          done < <(find tests -maxdepth 1 -type f -name '*.test.js' | sort)

      - name: Gate R3UI mobile browser hierarchy
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/tests"
          python tests/v319-r3ui-pedagogy-visual-hierarchy-browser.test.py

      - name: Gate remaining public browser and Python suites
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/tests"
          while IFS= read -r test; do
            case "$test" in
              *v319-r3ui-pedagogy-visual-hierarchy-browser.test.py) continue ;;
            esac
            echo "OTHER PUBLIC QA PY: $test"
            python "$test"
          done < <(find tests -maxdepth 1 -type f -name '*.test.py' | sort)
