name: QUADLUD v3.1.9 HF3.9 R5.6 browser regression QA
on:
  push:
    branches: [candidate/v3.1.9-hf3.9-r5.5]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quadlud-v319-hf39-r56
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Soleil-Lune precomputed pool builder smoke
        run: |
          set -euo pipefail
          node --check qa-public/tools/build_tango_precomputed_pool.js
          node qa-public/tools/build_tango_precomputed_pool.js --target 2 --attempts 12000 --output "$RUNNER_TEMP/tango-precomputed-smoke.js"
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const p=process.env.RUNNER_TEMP+'/tango-precomputed-smoke.js';
          const s={};s.globalThis=s;vm.createContext(s);vm.runInContext(fs.readFileSync(p,'utf8'),s);
          const d=s.QuadludTangoPrecomputedPoolData;
          if(!d||d.contract?.plannerVersion!==4||d.contract?.causalVersion!==11)throw new Error('pool contract mismatch');
          for(const x of ['easy','medium','hard','expert'])if(d.pools?.[x]?.length!==2)throw new Error(`${x} smoke count mismatch`);
          console.log('precomputed pool smoke: PASS');
          NODE
      - name: Upload Soleil-Lune pool smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: tango-precomputed-pool-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tango-precomputed-smoke.js
            ${{ runner.temp }}/tango-precomputed-smoke.js.report.json
          retention-days: 14
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install browser QA
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"; sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize QA layout
        run: |
          Q="$RUNNER_TEMP/q"; mkdir -p "$Q/GitHub" "$Q/tests"; rsync -a ./ "$Q/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'; cp -a qa-public/tests/. "$Q/tests/"
      - name: R5.5/R5.6 targeted contracts
        run: |
          cd "$RUNNER_TEMP/q"
          node tests/v319-hf39-r55-causal-atomic-contract.test.js
          node tests/v319-hf39-r55-stage-order.test.js
          node tests/v319-hf39-r55-valid-unit-label.test.js
          node tests/v319-hf39-r56-causal-closure.test.js
      - name: R5.5 causal proof browser regression
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-hf39-r55-human-causal-proof-browser.test.py
      - name: R5.4 human browser regression
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-hf39-r54-human-regression-browser.test.py
      - name: R5.4 Tutor presentation contract
        run: cd "$RUNNER_TEMP/q" && node tests/v319-hf39-r54-tutor-presentation.test.js
      - name: R5.4 E2 browser diagnostic
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-hf39-r54-e2-diagnostic-browser.test.py
