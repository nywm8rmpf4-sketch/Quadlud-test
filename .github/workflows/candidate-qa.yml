name: QUADLUD v3.1.9 HF3.9 R5.5 browser regression QA
on:
  push:
    branches: [candidate/v3.1.9-hf3.9-r5.5, candidate/v3.1.9-e-r5.5-fix]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quadlud-v319-hf39-r55
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install browser QA
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"; sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize QA layout
        run: |
          Q="$RUNNER_TEMP/q"; mkdir -p "$Q/GitHub" "$Q/tests"; rsync -a ./ "$Q/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'; cp -a qa-public/tests/. "$Q/tests/"
      - name: R5.5 targeted contracts
        run: |
          cd "$RUNNER_TEMP/q"
          node tests/v319-hf39-r55-causal-atomic-contract.test.js
          node tests/v319-hf39-r55-stage-order.test.js
          node tests/v319-hf39-r55-valid-unit-label.test.js
      - name: R5.5 causal proof browser regression
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-hf39-r55-human-causal-proof-browser.test.py
      - name: R5.4 human browser regression
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-hf39-r54-human-regression-browser.test.py
      - name: R5.4 Tutor presentation contract
        run: cd "$RUNNER_TEMP/q" && node tests/v319-hf39-r54-tutor-presentation.test.js
      - name: R5.4 E2 browser diagnostic
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-hf39-r54-e2-diagnostic-browser.test.py
