# HF3.9 R5.5 targeted candidate gate
name: QUADLUD v3.1.9 HF3.9 R5.5 targeted QA
on:
  push:
    branches: [candidate/v3.1.9-hf3.9-r5.5]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Runtime JavaScript syntax
        run: find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: HF3.9 R5.5 causal atomic contract
        run: node qa-public/tests/v319-hf39-r55-causal-atomic-contract.test.js
      - name: HF3.9 R5.5 contradiction stage order
        run: node qa-public/tests/v319-hf39-r55-stage-order.test.js
