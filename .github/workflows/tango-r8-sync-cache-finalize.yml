name: QUADLUD Tango R8 synchronized cache finalization
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths: ['.github/workflows/tango-r8-sync-cache-finalize.yml']
permissions:
  contents: write
jobs:
  build:
    name: build-${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        difficulty: [easy, medium, hard, expert]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Verify exact R8 pool and build synchronized shard
        run: |
          set -euo pipefail
          test "$(sha256sum tango-runtime-pool-data.js | cut -d' ' -f1)" = "6c3b226cc4c4db089768740510113bd07db2958a14216cf98020e7b0f4f9b013"
          mkdir -p "$RUNNER_TEMP/shard"
          node qa-public/tools/build_tango_tutor_sync_shard_r8.js \
            --difficulty "${{ matrix.difficulty }}" \
            --pool tango-runtime-pool-data.js \
            --output "$RUNNER_TEMP/shard/tango-tutor-sync-${{ matrix.difficulty }}.json" \
            --report "$RUNNER_TEMP/shard/${{ matrix.difficulty }}-report.json"
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const d='${{ matrix.difficulty }}';
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+`/shard/tango-tutor-sync-${d}.json`));
          assert.equal(x.schema,2);assert.equal(x.version,'tango-tutor-sync-shard-r2');assert.equal(x.difficulty,d);assert.equal(x.entries.length,120);
          assert.equal(x.tutorContract.digest,'b48da5bd09ae47acffa1ba787fe26e11c4c3e4830115b931392c6e9fa2e9c45a');
          const steps=x.entries.flatMap(e=>e[2]);assert(steps.length>0);assert.equal(new Set(steps.map(s=>s[0])).size,steps.length);assert(steps.every(s=>s.length===10&&Array.isArray(s[9])&&s[9].length>=11));
          console.log(`PASS ${d}: ${steps.length} canonical states, contract ${x.tutorContract.digest}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: tango-sync-${{ matrix.difficulty }}
          path: ${{ runner.temp }}/shard/
          if-no-files-found: error
          retention-days: 7

  combine:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          pattern: tango-sync-*
          path: ${{ runner.temp }}/sync
          merge-multiple: true
      - name: Compact losslessly and materialize guarded runtime package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package"
          node qa-public/tools/compact_tango_tutor_sync_r8.js "$RUNNER_TEMP/sync" "$RUNNER_TEMP/package"
          cp qa-public/tools/tango-tutor-precomputed-cache-sync-template.js "$RUNNER_TEMP/package/tango-tutor-precomputed-cache.js"
          node - <<'NODE'
          const fs=require('fs');
          const C=require('./qa-public/tools/tango_tutor_cache_contract.js').compute('.');
          const R=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/package/tango-tutor-cache-r8-sync-report.json'));
          if(C.digest!==R.tutorContract.digest)throw new Error(`contract mismatch ${C.digest} != ${R.tutorContract.digest}`);
          const data={...C,tutorPlannerToken:R.tutorPlannerToken,humanPolicy:R.humanPolicy,proofPolicy:R.proofPolicy};
          const js=`/* QUADLUD — Soleil-Lune Tutor cache contract R8. Copyright © 2026 Serge Benoliel. All rights reserved. */\n(function(root){'use strict';const c=${JSON.stringify(data)};root.QuadludTangoTutorCacheContractR8=Object.freeze(c);if(typeof module!=='undefined'&&module.exports)module.exports=Object.freeze(c);})(typeof globalThis!=='undefined'?globalThis:this);\n`;
          fs.writeFileSync(process.env.RUNNER_TEMP+'/package/tango-tutor-cache-contract-r8.js',js);
          NODE
          cp "$RUNNER_TEMP/package/tango-tutor-precomputed-cache.js" ./tango-tutor-precomputed-cache.js
          cp "$RUNNER_TEMP/package/tango-tutor-cache-contract-r8.js" ./tango-tutor-cache-contract-r8.js
          cp "$RUNNER_TEMP/package/tango-tutor-cache-data-r8.js" ./tango-tutor-cache-data-r8.js
          node --check tango-tutor-precomputed-cache.js
          node --check tango-tutor-cache-contract-r8.js
          node --check tango-tutor-cache-data-r8.js
          node - <<'NODE'
          const assert=require('assert');
          const C=require('./tango-tutor-precomputed-cache.js'),D=require('./tango-tutor-cache-data-r8.js');
          if(!C.info().registered)C.registerData(D);
          const i=C.info();assert.equal(i.version,3);assert.equal(i.dataSchema,8);assert.equal(i.dataVersion,'tango-tutor-cache-r8-sync2');assert.equal(i.contract.digest,'b48da5bd09ae47acffa1ba787fe26e11c4c3e4830115b931392c6e9fa2e9c45a');
          assert.deepStrictEqual(D.puzzleCounts,{easy:120,medium:120,hard:120,expert:120});
          for(const d of ['easy','medium','hard','expert'])assert(D.steps[d].length>0);
          console.log('PASS synchronized cache package registration',i);
          NODE
          (cd "$RUNNER_TEMP/package" && sha256sum tango-tutor-precomputed-cache.js tango-tutor-cache-contract-r8.js tango-tutor-cache-data-r8.js tango-tutor-cache-r8-sync-report.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tango-r8-sync-cache-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  parity:
    needs: combine
    name: parity-${{ matrix.difficulty }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        difficulty: [easy, medium, hard, expert]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: tango-r8-sync-cache-package
          path: ${{ runner.temp }}/package
      - name: Overlay generated package and prove exhaustive cache/live parity
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/package/tango-tutor-precomputed-cache.js" .
          cp "$RUNNER_TEMP/package/tango-tutor-cache-contract-r8.js" .
          cp "$RUNNER_TEMP/package/tango-tutor-cache-data-r8.js" .
          QUADLUD_PARITY_DIFFICULTY="${{ matrix.difficulty }}" \
          QUADLUD_PARITY_REPORT="$RUNNER_TEMP/parity-${{ matrix.difficulty }}.json" \
          node qa-public/tests/v319-r8-cache-live-parity.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: tango-r8-parity-${{ matrix.difficulty }}
          path: ${{ runner.temp }}/parity-${{ matrix.difficulty }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: tango-r8-sync-cache-package
          path: ${{ runner.temp }}/package
      - name: Integrate exact synchronized cache into browser and PWA
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/package/tango-tutor-precomputed-cache.js" .
          cp "$RUNNER_TEMP/package/tango-tutor-cache-contract-r8.js" .
          cp "$RUNNER_TEMP/package/tango-tutor-cache-data-r8.js" .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          reps={
            'tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof':'tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d',
            'tango-human-cost-bridge.js?v=3.1.9-r3ui-local-proof-hf3r1':'tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5',
            'tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r1':'tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract'
          }
          for old,new in reps.items():
            if s.count(old)!=1: raise SystemExit(f'index cache-bust anchor mismatch: {old}')
            s=s.replace(old,new)
          old='<script src="tango-tutor-precomputed-cache.js?v=3.1.9-r8-exact"></script><script src="tango-tutor-cache-data-r8.js?v=3.1.9-r8-exact"></script>'
          new='<script src="tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d"></script><script src="tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync2-7d"></script><script src="tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync2-7d"></script>'
          if s.count(old)!=1: raise SystemExit('index synchronized cache anchor mismatch')
          p.write_text(s.replace(old,new))

          p=Path('sw.js'); s=p.read_text()
          if s.count("const CACHE='quadlud-v3.1.9-tango-r8-exact-v17';")!=1: raise SystemExit('SW cache identity anchor mismatch')
          s=s.replace("const CACHE='quadlud-v3.1.9-tango-r8-exact-v17';","const CACHE='quadlud-v3.1.9-tango-r8-sync2-7d-v18';")
          reps={
            './tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof':'./tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d',
            './tango-human-cost-bridge.js?v=3.1.9-r3ui-local-proof-hf3r1':'./tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5',
            './tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r1':'./tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract'
          }
          for old,new in reps.items():
            if s.count(old)!=1: raise SystemExit(f'SW cache-bust anchor mismatch: {old}')
            s=s.replace(old,new)
          old="'./tango-tutor-precomputed-cache.js?v=3.1.9-r8-exact','./tango-tutor-cache-data-r8.js?v=3.1.9-r8-exact'"
          new="'./tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d','./tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync2-7d','./tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync2-7d'"
          if s.count(old)!=1: raise SystemExit('SW synchronized cache anchor mismatch')
          p.write_text(s.replace(old,new))

          p=Path('qa-public/tests/v319-r8-integrated-browser.test.py'); s=p.read_text()
          old='quadlud-v3.1.9-tango-r8-exact-v17'; new='quadlud-v3.1.9-tango-r8-sync2-7d-v18'
          if s.count(old)!=1: raise SystemExit('browser SW expectation anchor mismatch')
          p.write_text(s.replace(old,new))
          PY
          node --check tango-tutor-precomputed-cache.js
          node --check tango-tutor-cache-contract-r8.js
          node --check tango-tutor-cache-data-r8.js
          node --check tango-human-cost-bridge.js
          node --check tango-played-move-runtime.js
          node --check tango-human-pedagogy-r4.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('sw.js').read_text(); m=re.search(r'const ASSETS=\[(.*?)\];',s,re.S)
          if not m: raise SystemExit('SW ASSETS missing')
          assets=re.findall(r"'([^']+)'",m.group(1))
          if len(assets)!=len(set(assets)): raise SystemExit('duplicate SW precache URLs')
          required='./tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d'
          if required not in assets: raise SystemExit('synchronized cache contract not precached')
          print('PASS SW unique precache URLs',len(assets))
          PY
          git diff --check
      - name: Commit synchronized cache only after four parity gates PASS
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-tutor-precomputed-cache.js tango-tutor-cache-contract-r8.js tango-tutor-cache-data-r8.js index.html sw.js qa-public/tests/v319-r8-integrated-browser.test.py
          git diff --cached --check
          git commit -m 'feat(tango): integrate synchronized guarded R8 Tutor cache'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
