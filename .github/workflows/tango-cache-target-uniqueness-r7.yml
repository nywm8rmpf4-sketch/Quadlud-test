name: QUADLUD Tango target-only Tutor cache audit R7
on:
  push:
    branches: ["qa/tango-cache-target-unique-r7"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download cache-matching certified compact 120x4 pool artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pool"
          gh api repos/nywm8rmpf4-sketch/Quadlud-test/actions/artifacts/10095056023/zip > "$RUNNER_TEMP/pool.zip"
          unzip -q "$RUNNER_TEMP/pool.zip" -d "$RUNNER_TEMP/pool"
      - name: Download certified Tutor cache artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache"
          gh run download 34330141819 -n tango-tutor-cache-r4-complete -D "$RUNNER_TEMP/cache"
      - name: Verify source artifact integrity and versions
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/pool/tango-diversity-pool.js"
          for d in easy medium hard expert; do test -s "$RUNNER_TEMP/cache/tango-tutor-cache-$d.json"; done
          node - <<'NODE'
          const Pool=require(process.env.RUNNER_TEMP+'/pool/tango-diversity-pool.js');
          if(Pool.version!=='tango-precompute-pool-v6-compact') throw new Error('unexpected compact pool version '+Pool.version);
          for(const d of ['easy','medium','hard','expert']){
            const c=require(process.env.RUNNER_TEMP+'/cache/tango-tutor-cache-'+d+'.json');
            if(c.poolVersion!==Pool.version) throw new Error(`${d}: cache/pool version mismatch`);
            if(!Array.isArray(Pool.entries?.[d])||Pool.entries[d].length<120) throw new Error(`${d}: pool < 120`);
          }
          console.log('POOL_CACHE_VERSION_MATCH PASS');
          NODE
      - name: Audit target-value uniqueness over all cached states
        run: |
          set -euo pipefail
          node qa-public/tests/tango-cache-target-uniqueness-r7.test.js "$RUNNER_TEMP/pool/tango-diversity-pool.js" "$RUNNER_TEMP/cache" | tee "$RUNNER_TEMP/tango-cache-target-uniqueness-r7-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tango-cache-target-uniqueness-r7
          path: ${{ runner.temp }}/tango-cache-target-uniqueness-r7-report.json
          if-no-files-found: warn
