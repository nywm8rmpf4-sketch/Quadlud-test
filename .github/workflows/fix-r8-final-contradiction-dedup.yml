name: Fix R8 final contradiction dedup
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths:
      - '.github/workflows/fix-r8-final-contradiction-dedup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Patch final contradiction dedup and PWA revision
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tango-pedagogy-text-finalizer.js')
          s=p.read_text(encoding='utf-8')
          if s.count('const VERSION=3;')!=1:
              raise SystemExit('unexpected finalizer VERSION anchor')
          s=s.replace('const VERSION=3;','const VERSION=4;')
          old="function sanitizePresentation(presentation){return presentation&&typeof presentation==='object'?finalizeValue(copy(presentation)):presentation}"
          new="""function dedupPresentationMove(presentation){
            if(!presentation||typeof presentation!=='object')return presentation;const explanation=presentation.explanation;if(!explanation||typeof explanation!=='object'||typeof explanation.why!=='string'||typeof explanation.move!=='string')return presentation;const moveKey=propositionKey(explanation.move);if(!moveKey)return presentation;
            const parts=explanation.why.split(/(?<=[.!?])\\s+/);explanation.why=parts.filter(part=>{const key=propositionKey(part);return !(key===moveKey&&/^\\s*(?:Donc|Therefore|Conclusion)(?:\\s*:|\\s|$)/i.test(part))}).join(' ').trim();return presentation
          }
          function sanitizePresentation(presentation){return presentation&&typeof presentation==='object'?dedupPresentationMove(finalizeValue(copy(presentation))):presentation}"""
          if s.count(old)!=1:
              raise SystemExit(f'sanitizePresentation anchor count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('qa-public/tests/v319-r3ui-tango-text-finalizer.test.js')
          s=p.read_text(encoding='utf-8')
          anchor="assert.strictEqual(sanitized.metadata.showTutorMove,true);"
          insert="""assert.strictEqual(sanitized.metadata.showTutorMove,true);

          // Final contradiction action: keep the actionable move once, not both
          // "Donc X = ..." and an identical "Coup conseillé : X = ...".
          const contradiction=Finalizer.sanitizePresentation({
            explanation:{where:'Regarde A1.',why:'L’hypothèse est impossible. Donc A1 = moon 🌙.',move:'A1 = moon 🌙.'},
            metadata:{showTutorMove:true}
          });
          assert.strictEqual(contradiction.explanation.why,'L’hypothèse est impossible.',contradiction.explanation.why);
          assert(contradiction.explanation.move.includes('A1 = lune ☾'),contradiction.explanation.move);
          assert(!/Donc\\s+A1\\s*=/i.test(contradiction.explanation.why),contradiction.explanation.why);"""
          if s.count(anchor)!=1:
              raise SystemExit(f'test anchor count={s.count(anchor)}')
          s=s.replace(anchor,insert)
          if s.count("tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest1")!=1:
              raise SystemExit('unexpected finalizer query assertion anchor')
          s=s.replace("tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest1","tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest2")
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest1'; new='tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest2'
          if s.count(old)!=1: raise SystemExit(f'index finalizer URL count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if s.count("const CACHE='quadlud-v3.1.9-tango-r8-exact-v15';")!=1: raise SystemExit('SW cache identity anchor mismatch')
          s=s.replace("const CACHE='quadlud-v3.1.9-tango-r8-exact-v15';","const CACHE='quadlud-v3.1.9-tango-r8-exact-v16';")
          old='./tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest1'; new='./tango-pedagogy-text-finalizer.js?v=3.1.9-hf3.6-retest2'
          if s.count(old)!=1: raise SystemExit(f'SW finalizer URL count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('qa-public/tests/v319-r8-integrated-browser.test.py'); s=p.read_text(encoding='utf-8')
          if s.count('quadlud-v3.1.9-tango-r8-exact-v15')!=1: raise SystemExit('R8 cache assertion anchor mismatch')
          p.write_text(s.replace('quadlud-v3.1.9-tango-r8-exact-v15','quadlud-v3.1.9-tango-r8-exact-v16'),encoding='utf-8')
          PY
      - name: Run targeted regressions in canonical layout
        run: |
          set -euo pipefail
          node --check tango-pedagogy-text-finalizer.js
          git diff --check
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const src=fs.readFileSync('sw.js','utf8');
          const m=src.match(/const ASSETS=(\[[\s\S]*?\]);/);assert(m,'ASSETS not found');
          const assets=vm.runInNewContext(m[1]);
          assert.strictEqual(assets.length,new Set(assets).size,'service-worker precache must stay unique');
          assert.strictEqual(assets.length,128,'expected 128 precache URLs');
          console.log(`PASS SW precache uniqueness ${assets.length}/${new Set(assets).size}`);
          NODE
          R="$RUNNER_TEMP/r8-final-text"; rm -rf "$R"; mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          cd "$R"
          node tests/v319-r3ui-tango-text-finalizer.test.js
          node tests/v319-hf39-r55-internal-action-continuity.test.js
          node tests/v319-hf39-semantic-coherence.test.js
      - name: Commit tested final text fix
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-pedagogy-text-finalizer.js qa-public/tests/v319-r3ui-tango-text-finalizer.test.js index.html sw.js qa-public/tests/v319-r8-integrated-browser.test.py
          git diff --cached --check
          git commit -m 'fix(tango): remove duplicate final contradiction conclusion'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
