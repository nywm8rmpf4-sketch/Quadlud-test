name: Fix R8 hypothetical marker dedup
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths:
      - '.github/workflows/fix-r8-marker-dedup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Patch marker projection ownership
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tango-tutor-human-regression-r54.js'); s=p.read_text(encoding='utf-8')
          old="function projectedMarkers(group,index){\n  const entries=Array.isArray(group?.entries)?group.entries:[],raw=[],seen=new Set(),directSeen=new Set(),limit=Math.min(Number(index)||0,entries.length-1);\n  for(let i=0;i<=limit;i++){\n    const move=entries[i]?.move;for(const c of valueConclusions(entryDeduction(move)))directSeen.add(`${cellKey(c.cell)}:${Number(c.value)}`);\n    for(const projection of projectedConsequencesForMove(move)){const key=`${cellKey(projection.cell)}:${projection.value}`;if(directSeen.has(key)||seen.has(key))continue;seen.add(key);raw.push({...projection,current:i===Number(index)})}\n  }\n  raw.sort((a,b)=>a.afterSequence-b.afterSequence||cellKey(a.cell).localeCompare(cellKey(b.cell)));\n  return raw.map((projection,i)=>({...projection,sequence:projection.afterSequence+1+raw.slice(0,i).filter(p=>p.afterSequence<=projection.afterSequence).length}))\n}"
          new="function hypothesisFactKeys(entries,limit){const out=new Set();for(let i=0;i<=Math.min(Number(limit)||0,(entries?.length||1)-1);i++){const d=entryDeduction(entries[i]?.move);for(const premise of d?.premises||[]){if(!(premise?.hypothesis===true||String(premise?.kind||'').toUpperCase()==='ASSUMPTION')||!Array.isArray(premise.cell)||(Number(premise.value)!==0&&Number(premise.value)!==1))continue;out.add(`${cellKey(premise.cell)}:${Number(premise.value)}`)}}return out}\nfunction projectedMarkers(group,index){\n  const entries=Array.isArray(group?.entries)?group.entries:[],raw=[],seen=new Set(),directSeen=new Set(),limit=Math.min(Number(index)||0,entries.length-1),hypotheses=hypothesisFactKeys(entries,limit);\n  for(let i=0;i<=limit;i++){\n    const move=entries[i]?.move;for(const c of valueConclusions(entryDeduction(move)))directSeen.add(`${cellKey(c.cell)}:${Number(c.value)}`);\n    for(const projection of projectedConsequencesForMove(move)){const key=`${cellKey(projection.cell)}:${projection.value}`;if(hypotheses.has(key)||directSeen.has(key)||seen.has(key))continue;seen.add(key);raw.push({...projection,current:i===Number(index)})}\n  }\n  raw.sort((a,b)=>a.afterSequence-b.afterSequence||cellKey(a.cell).localeCompare(cellKey(b.cell)));\n  return raw.map((projection,i)=>({...projection,sequence:projection.afterSequence+1+raw.slice(0,i).filter(p=>p.afterSequence<=projection.afterSequence).length}))\n}"
          if s.count(old)!=1: raise SystemExit(f'projectedMarkers match count={s.count(old)}')
          s=s.replace(old,new)
          old="function applyProjectedRelationMarkers(board,g,index){if(!board)return false;const projections=projectedMarkers(g,index);if(!projections.length)return false;board.querySelectorAll?.('.hf39-marker-badge:not([data-hf39-r54-projection=\"true\"])').forEach(badge=>{const raw=Number(String(badge.textContent||'').trim());if(Number.isInteger(raw)&&raw>0)badge.textContent=String(shiftedSequence(raw,projections))});for(const marker of projections)addProjectedMarker(board,marker);return true}"
          new="function suppressCanonicalProjectionDuplicate(board,marker){const cell=board?.querySelector?.(`[data-r=\"${Number(marker.cell?.[0])}\"][data-c=\"${Number(marker.cell?.[1])}\"]`);if(!cell)return false;let changed=false;cell.querySelectorAll?.('.hf39-marker-badge:not([data-hf39-r54-projection=\"true\"])').forEach(badge=>{const raw=Number(String(badge.textContent||'').trim());if(Number.isInteger(raw)&&raw>0){badge.remove();changed=true}});cell.querySelectorAll?.('.hf39-hypothetical-piece.is-consequence:not([data-hf39-r54-projection=\"true\"])').forEach(piece=>{piece.remove();changed=true});return changed}\nfunction applyProjectedRelationMarkers(board,g,index){if(!board)return false;const projections=projectedMarkers(g,index);if(!projections.length)return false;for(const marker of projections)suppressCanonicalProjectionDuplicate(board,marker);board.querySelectorAll?.('.hf39-marker-badge:not([data-hf39-r54-projection=\"true\"])').forEach(badge=>{const raw=Number(String(badge.textContent||'').trim());if(Number.isInteger(raw)&&raw>0)badge.textContent=String(shiftedSequence(raw,projections))});for(const marker of projections)addProjectedMarker(board,marker);return true}"
          if s.count(old)!=1: raise SystemExit(f'applyProjectedRelationMarkers match count={s.count(old)}')
          s=s.replace(old,new)
          old="projectedConsequencesForMove,projectedMarkers,shiftedSequence,relationBalanceDetail"
          new="projectedConsequencesForMove,hypothesisFactKeys,projectedMarkers,shiftedSequence,suppressCanonicalProjectionDuplicate,relationBalanceDetail"
          if s.count(old)!=1: raise SystemExit(f'export match count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Extend R5.4 regression contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qa-public/tests/v319-hf39-r54-tutor-presentation.test.js'); s=p.read_text(encoding='utf-8')
          anchor="const c3={pedagogyStageKind:'reasoning',beforeSnapshot:{state},deduction:{conclusions:[{type:'VALUE',cell:[2,2],value:1}]},causalStep:{id:'cp12',kind:'deduction',sequenceIndex:3,premises:[]}};"
          insert="""// A projected sibling must never turn the branch hypothesis itself into a numbered consequence.\nconst hypA1={pedagogyStageKind:'hypothesis',deduction:{premises:[{kind:'ASSUMPTION',cell:[0,0],value:1,hypothesis:true}],conclusions:[]},causalStep:{kind:'hypothesis',sequenceIndex:0}};\nconst a2ToA1={pedagogyStageKind:'reasoning',beforeSnapshot:{state:empty()},deduction:{conclusions:[{type:'VALUE',cell:[0,1],value:0}]},causalStep:{kind:'deduction',sequenceIndex:1,premises:[{kind:'RELATION',a:[0,1],b:[0,0],parity:1,explicit:true}]}};\nconst hypothesisProtected=R._test.projectedMarkers({entries:[{move:hypA1},{move:a2ToA1}]},1);\nassert(!hypothesisProtected.some(x=>x.cell[0]===0&&x.cell[1]===0&&x.value===1),'A1 hypothesis H must never be duplicated as a numbered projected consequence');\n\n"""+anchor
          if s.count(anchor)!=1: raise SystemExit(f'test anchor count={s.count(anchor)}')
          p.write_text(s.replace(anchor,insert),encoding='utf-8')
          PY
      - name: Run targeted R5.4 regressions in canonical layout
        run: |
          set -euo pipefail
          node --check tango-tutor-human-regression-r54.js
          git diff --check
          R="$RUNNER_TEMP/r54"; rm -rf "$R"; mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          cd "$R"
          node tests/v319-hf39-r54-tutor-presentation.test.js
          node tests/v319-hf39-r55-internal-action-continuity.test.js
          node tests/v319-hf39-semantic-coherence.test.js
      - name: Commit tested marker dedup
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-tutor-human-regression-r54.js qa-public/tests/v319-hf39-r54-tutor-presentation.test.js
          git diff --cached --check
          git commit -m 'fix(tango): keep one stable hypothetical marker per fact'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
