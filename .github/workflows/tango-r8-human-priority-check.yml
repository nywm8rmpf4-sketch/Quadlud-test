name: QUADLUD Tango R8 human priority check
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths:
      - '.github/workflows/tango-r8-human-priority-check.yml'
      - 'qa-public/tests/v319-r8-simple-before-contradiction.test.js'
permissions: {contents: write}
jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Fix direct-before-advanced human Tutor selection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tango-human-pedagogy-r4.js')
          s=p.read_text(encoding='utf-8')
          old="function planner(){const p=Planner||root.QuadludTangoPlayedMovePlanner;if(!p||typeof p.nextPlayedMove!=='function')throw new Error('Soleil/Lune played-move planner unavailable');return p}"
          new="function planner(){const p=root.QuadludTangoPlayedMovePlanner||Planner;if(!p||typeof p.nextPlayedMove!=='function')throw new Error('Soleil/Lune played-move planner unavailable');return p}"
          if s.count(old)!=1: raise SystemExit(f'unexpected planner composition anchor count={s.count(old)}')
          s=s.replace(old,new)
          old="const tierIndex=P.tierIndexForDifficulty(diff),direct=T.allowedDirectDeductions(session,tierIndex),evaluation=T.evaluateStartingDeductions(session,tierIndex,direct,options,false),frontierComplete=!evaluation.truncated&&!evaluation.branchBudgetHit;"
          new="const tierIndex=P.tierIndexForDifficulty(diff),direct=T.allowedDirectDeductions(session,tierIndex),fastEvaluate=P._attentionTest?.evaluateDirectStartingDeductions,evaluation=typeof fastEvaluate==='function'?fastEvaluate(session,tierIndex,direct,options):T.evaluateStartingDeductions(session,tierIndex,direct,options,false),frontierComplete=!evaluation.truncated&&!evaluation.branchBudgetHit;"
          if s.count(old)!=1: raise SystemExit(f'unexpected direct evaluation anchor count={s.count(old)}')
          s=s.replace(old,new)
          old="if(!frontier||!frontier.frontierComplete||!frontier.plans.length)return Base.planHumanMove(session,diff);"
          new="if(!frontier||!frontier.plans.length)return Base.planHumanMove(session,diff);"
          if s.count(old)!=1: raise SystemExit(f'unexpected frontier fallback anchor count={s.count(old)}')
          s=s.replace(old,new)
          old="return {...plan,displayProof:proof,displayDeduction,selectionStatus:'human-proof-global-minimum',selectedCostVector:chosen.plannerCost.slice(),candidateCount:ranked.length,frontierComplete:true,budgetHit:false,humanGlobalSelection:true,humanCandidateCount:ranked.length,humanSignature:`${plan.target.join(',')}:${plan.value}|${plan.startingDeduction?.signature||plan.deduction?.signature||plan.deduction?.id||''}|${proof?.kind||'engine-proof'}|global`}"
          new="return {...plan,displayProof:proof,displayDeduction,selectionStatus:frontier.frontierComplete?'human-proof-global-minimum':'human-proof-direct-minimum-budget-limited',selectedCostVector:chosen.plannerCost.slice(),candidateCount:ranked.length,frontierComplete:frontier.frontierComplete,budgetHit:!frontier.frontierComplete,humanGlobalSelection:true,humanCandidateCount:ranked.length,humanSignature:`${plan.target.join(',')}:${plan.value}|${plan.startingDeduction?.signature||plan.deduction?.signature||plan.deduction?.id||''}|${proof?.kind||'engine-proof'}|global`}"
          if s.count(old)!=1: raise SystemExit(f'unexpected chosen-plan metadata anchor count={s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          node --check tango-human-pedagogy-r4.js
          git diff --check
      - name: Materialize canonical layout and run human-priority regressions
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/q"; rm -rf "$R"; mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          cd "$R"
          node --check tests/v319-r8-simple-before-contradiction.test.js
          node tests/v319-r8-simple-before-contradiction.test.js
          node tests/v319-r3ui-tango-attention-fast-frontier.test.js
          node tests/v319-r5-frontier-validation-cache.test.js
          node tests/v319-hf36-human-next-move-policy.test.js
          node tests/v319-r3ui-tango-tutor-freeze-guard.test.js
      - name: Commit tested human-priority correction
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-human-pedagogy-r4.js
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(tango): prefer demonstrated direct move before contradiction'
            git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
          fi
