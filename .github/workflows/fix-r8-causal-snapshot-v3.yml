name: Fix R8 causal snapshot v3
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths:
      - '.github/workflows/fix-r8-causal-snapshot-v3.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Patch semantic continuity source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tango-semantic-coherence-hf39.js')
          s=p.read_text(encoding='utf-8')
          old="function normalizeGeneratedMoves(s,start){if(!s||s.base?.game!=='tango'||!Array.isArray(s.moves)||start<0||start>=s.moves.length)return false;const added=s.moves.slice(start),last=added.length-1;added.forEach((m,i)=>{const reported=String(m?.pedagogyStageKind||m?.proofStage?.kind||(i===last?'action':'reasoning')),original=i!==last&&reported==='action'?'reasoning':reported;if(i!==last&&m?.proofSnapshot)m.snapshot=copy(m.proofSnapshot);normalizePresentation(m,{isFinal:i===last,originalKind:original})});return true}"
          new="function rebuildCausalProof(entries){const model=root.QuadludTangoCausalProofModel;if(!Array.isArray(entries)||!entries.length||typeof model?.fromEntries!=='function')return false;let proof;try{proof=model.fromEntries(entries)}catch(_){return false}entries.forEach((m,i)=>{m.causalProof=copy(proof);m.causalStepId=proof?.entryStepIds?.[i]||null});return true}\nfunction normalizeGeneratedMoves(s,start){if(!s||s.base?.game!=='tango'||!Array.isArray(s.moves)||start<0||start>=s.moves.length)return false;const added=s.moves.slice(start),last=added.length-1;let demoted=false;added.forEach((m,i)=>{const reported=String(m?.pedagogyStageKind||m?.proofStage?.kind||(i===last?'action':'reasoning')),internalAction=i!==last&&reported==='action',original=internalAction?'reasoning':reported;if(i!==last){const safe=internalAction?(m?.beforeSnapshot||m?.proofSnapshot):m?.proofSnapshot;if(safe){m.proofSnapshot=copy(safe);m.snapshot=copy(safe)}}normalizePresentation(m,{isFinal:i===last,originalKind:original});demoted=demoted||internalAction});if(demoted)rebuildCausalProof(added);return true}"
          if s.count(old)!=1: raise SystemExit(f'normalize function match count={s.count(old)}')
          s=s.replace(old,new)
          old_export="return Object.freeze({VERSION,TOKEN,OWNS_HYPOTHETICAL_MARKERS,install,scheduleInstall,normalizeGeneratedMoves,decorate,_test:Object.freeze({sameCell,stageKind,causalStep,valueConclusions,assumptionOf,snapshotValue,atomicAction,atomicActionText,normalizePresentation,proofMarkers})});});"
          new_export="return Object.freeze({VERSION,TOKEN,OWNS_HYPOTHETICAL_MARKERS,install,scheduleInstall,normalizeGeneratedMoves,decorate,_test:Object.freeze({sameCell,stageKind,causalStep,valueConclusions,assumptionOf,snapshotValue,atomicAction,atomicActionText,normalizePresentation,rebuildCausalProof,proofMarkers})});});"
          if s.count(old_export)!=1: raise SystemExit(f'export match count={s.count(old_export)}')
          p.write_text(s.replace(old_export,new_export),encoding='utf-8')
          PY
      - name: Write causal snapshot regression
        run: |
          cat > qa-public/tests/v319-hf39-r55-internal-action-continuity.test.js <<'NODE'
          /* QUADLUD — regression: internal proof actions must remain hypothetical. */
          'use strict';
          const assert=require('assert'),fs=require('fs'),path=require('path');
          function runtime(name){const candidates=[path.resolve(__dirname,'../GitHub',name),path.resolve(__dirname,'../../',name),path.resolve(__dirname,'../../GitHub',name)],found=candidates.find(fs.existsSync);assert(found,`cannot locate ${name}`);return found}
          const Model=require(runtime('tango-causal-proof-model.js'));global.QuadludTangoCausalProofModel=Model;
          const S=require(runtime('tango-semantic-coherence-hf39.js'));
          const empty=()=>Array.from({length:6},()=>Array(6).fill(-1)),snap=state=>({state:state.map(r=>r.slice())});
          const base=empty(),branch=empty(),final=empty();branch[0][0]=1;branch[3][5]=0;final[0][0]=0;
          const presentation=()=>({metadata:{showTutorMove:true},explanation:{where:'',why:'',move:'D6 = lune ☾'}});
          const hypothesis={pedagogyStageKind:'hypothesis',proofStage:{kind:'hypothesis',apply:false},proofSnapshot:snap(base),snapshot:snap(final),beforeSnapshot:snap(base),deduction:{rule:'ASSUMPTION_CONTRADICTION',premises:[{kind:'ASSUMPTION',cell:[0,0],value:1,hypothesis:true}],conclusions:[]},presentation:presentation(),move:'A1 = soleil ☀'};
          const internal={pedagogyStageKind:'action',proofStage:{kind:'action',apply:true},proofSnapshot:snap(branch),snapshot:snap(final),beforeSnapshot:snap(base),deduction:{id:'D49:presentation:1:pedagogical-final-action',rule:'LINE_DOMAIN_SUPPORT',conclusions:[{type:'VALUE',cell:[3,5],value:0}]},presentation:presentation(),move:'D6 = lune ☾'};
          const contradiction={pedagogyStageKind:'contradiction',proofStage:{kind:'contradiction',apply:false},proofSnapshot:snap(branch),snapshot:snap(final),beforeSnapshot:snap(base),deduction:{rule:'ASSUMPTION_CONTRADICTION',conclusions:[]},presentation:presentation(),move:''};
          const rollback={pedagogyStageKind:'rollback',proofStage:{kind:'rollback',apply:false},proofSnapshot:snap(base),snapshot:snap(final),beforeSnapshot:snap(base),deduction:{rule:'ROLLBACK',conclusions:[]},presentation:presentation(),move:''};
          const action={pedagogyStageKind:'action',proofStage:{kind:'action',apply:true},proofSnapshot:snap(final),snapshot:snap(final),beforeSnapshot:snap(base),target:[0,0],deduction:{rule:'ASSUMPTION_CONTRADICTION',conclusions:[{type:'VALUE',cell:[0,0],value:0}]},presentation:presentation(),move:'A1 = lune ☾'};
          const session={base:{game:'tango'},moves:[hypothesis,internal,contradiction,rollback,action]};
          const stale=Model.fromEntries(session.moves);session.moves.forEach((m,i)=>{m.causalProof=JSON.parse(JSON.stringify(stale));m.causalStepId=stale.entryStepIds[i]});
          assert.strictEqual(S._test.causalStep(internal).kind,'conclusion');
          assert.strictEqual(S.normalizeGeneratedMoves(session,0),true);
          assert.strictEqual(internal.pedagogyStageKind,'reasoning');
          assert.strictEqual(internal.proofStage.kind,'reasoning');
          assert.strictEqual(internal.proofStage.apply,false);
          assert.strictEqual(internal.presentation.metadata.showTutorMove,false);
          assert.strictEqual(internal.move,'');
          assert.strictEqual(internal.snapshot.state[0][0],-1);
          assert.strictEqual(internal.snapshot.state[3][5],-1);
          assert.strictEqual(internal.proofSnapshot.state[0][0],-1);
          const causal=S._test.causalStep(internal);
          assert.strictEqual(causal.kind,'deduction');
          assert.strictEqual(causal.hypothetical,true);
          const markers=S._test.proofMarkers({entries:session.moves.map(move=>({move}))},1);
          assert(markers.some(m=>m.kind==='hypothesis'&&m.cell[0]===0&&m.cell[1]===0&&m.value===1));
          assert(markers.some(m=>m.kind==='consequence'&&m.cell[0]===3&&m.cell[1]===5&&m.value===0));
          assert.strictEqual(action.pedagogyStageKind,'action');
          assert.strictEqual(action.snapshot.state[0][0],0);
          assert.strictEqual(session.moves.filter(m=>m.pedagogyStageKind==='action').length,1);
          console.log('PASS causal snapshot continuity: no final leak; internal VALUE remains hypothetical.');
          NODE
      - name: Run targeted regressions
        run: |
          set -euo pipefail
          node --check tango-semantic-coherence-hf39.js
          node --check qa-public/tests/v319-hf39-r55-internal-action-continuity.test.js
          node qa-public/tests/v319-hf39-r55-internal-action-continuity.test.js
          node qa-public/tests/v319-hf39-semantic-coherence.test.js
          git diff --check
      - name: Commit tested source and regression
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-semantic-coherence-hf39.js qa-public/tests/v319-hf39-r55-internal-action-continuity.test.js
          git diff --cached --check
          git commit -m 'fix(tango): rebuild hypothetical proof after internal action demotion'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
