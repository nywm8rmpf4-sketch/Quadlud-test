name: QUADLUD v3.2-B UX2 local progression QA
on:
  push:
    branches: ['candidate/v3.2-b-ux2-*']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quadlud-v320-b-ux2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ux2-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install browser QA
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/q";mkdir -p "$Q/GitHub" "$Q/tests"
          rsync -a ./ "$Q/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$Q/tests/"
      - name: Fresh UX2 and persistence contracts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          node tests/v320-b-progression-profile-contract.test.js
          node tests/data-serialization.test.js
      - name: UX2 browser matrix
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v320-b-progression-profile-browser.test.py
      - name: Impacted UX1 accessibility and UI regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          PYTHONPATH="$PWD/tests" python tests/v320-a-victory-insight-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v319-g-accessibility-performance-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v318-u14-ui-coherence-browser.test.py
      - name: Five-game runtime smoke
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          python -m http.server 8765 --directory GitHub >/tmp/quadlud-v320b-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .25; done
          PYTHONPATH="$PWD/tests" QUADLUD_R8_BASE_URL=http://127.0.0.1:8765/ python tests/v319-shared-games-smoke-browser.test.py
      - name: Public runtime guard
        run: |
          set -euo pipefail
          PYTHONPATH=qa-public/tests python qa-public/tests/public_runtime_guard.py
