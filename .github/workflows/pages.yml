name: QUADLUD public QA + pre-production deploy

on:
  push:
    branches: [main, automation/v319-a13-qa]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: quadlud-test-preprod
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@v4

      - name: Enforce public/private boundary
        run: python3 qa-public/tests/public_runtime_guard.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"
          rm -rf "$QA_ROOT"
          mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/tests"
          rsync -a ./ "$QA_ROOT/GitHub/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='qa-release/' \
            --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/tests/"
          test -f "$QA_ROOT/GitHub/index.html"
          test -n "$(find "$QA_ROOT/tests" -maxdepth 1 -type f \( -name '*.test.py' -o -name '*.test.js' \) -print -quit)"

      - name: Check runtime JavaScript syntax
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/quadlud-public-qa/GitHub" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run all exported public QA suites
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/tests"
          while IFS= read -r test; do
            echo "PUBLIC QA JS: $test"
            node "$test"
          done < <(find tests -maxdepth 1 -type f -name '*.test.js' | sort)
          while IFS= read -r test; do
            echo "PUBLIC QA PY: $test"
            python "$test"
          done < <(find tests -maxdepth 1 -type f -name '*.test.py' | sort)

      - name: Build Pages payload from runtime only
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/quadlud-pages"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          rsync -a ./ "$PAYLOAD/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='qa-release/' \
            --exclude='LICENSE'
          test -f "$PAYLOAD/index.html"
          test ! -e "$PAYLOAD/qa-public"
          test ! -e "$PAYLOAD/qa-release"
          test ! -e "$PAYLOAD/.github"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload runtime-only static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/quadlud-pages

      - name: Deploy pre-production
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish QA handoff marker
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const marker = status === 'success' ? 'QA_PUBLIC_PASS' : 'QA_PUBLIC_RESUME_REQUIRED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `<!-- QUADLUD_QA_HANDOFF -->`,
              `**${marker}**`,
              `- public_sha: \`${context.sha}\``,
              `- run_id: \`${context.runId}\``,
              `- run_attempt: \`${context.runAttempt}\``,
              `- status: **${status}**`,
              `- run: ${runUrl}`,
              status === 'success'
                ? '- next: pre-production deployed; continue with required human/remaining release gates.'
                : '- next: inspect this public QA run, resume from the latest private checkpoint, correct only the proven failure, export a new public candidate, and rerun.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body
            });