name: QUADLUD public QA + pre-production deploy

on:
  push:
    branches: [main, candidate/tango-diversity-pilot-v1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: quadlud-test-preprod
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@v4

      - name: Enforce public/private boundary
        run: python3 qa-public/tests/public_runtime_guard.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"
          rm -rf "$QA_ROOT"
          mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/qa-public/tests"
          rsync -a ./ "$QA_ROOT/GitHub/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='qa-release/' \
            --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/qa-public/tests/"
          ln -s ../GitHub "$QA_ROOT/qa-public/GitHub"
          # Legacy exported audits resolve runtime modules two levels above tests.
          # Mirror the exact runtime into that compatibility root for the QA process only.
          cp -a "$QA_ROOT/GitHub/." "$QA_ROOT/"
          test -f "$QA_ROOT/GitHub/index.html"
          test -n "$(find "$QA_ROOT/qa-public/tests" -maxdepth 1 -type f \( -name '*.test.py' -o -name '*.test.js' \) -print -quit)"

      - name: Check runtime JavaScript syntax
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/quadlud-public-qa/GitHub" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run all exported public QA suites
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/qa-public/tests"
          while IFS= read -r test; do
            echo "PUBLIC QA JS: $test"
            case "$(basename "$test")" in
              tango-cache-ordinal-r8.test.js|tango-cache-target-uniqueness-r7.test.js|tango-trace-compact-r2.test.js|v319-r8-cognitive-cache-live-parity.test.js|v319-r8-materialized-dag.test.js)
                echo "NOT_EXECUTED / not applicable here: $test (dedicated generated-cache/compaction or exhaustive sharded parity audit)"
                ;;
              tango-precompute-pool-v5-contract.test.js|tango-runtime-data-r8-static-contract.test.js|v319-r8-cache-live-parity.test.js|v319-r8-relation-lightweight-planner.test.js)
                echo "NOT_EXECUTED / obsolete: $test (superseded prototype, pre-cognitive, or pre-R8 pool/shard contract)"
                ;;
              *) node "$test" ;;
            esac
          done < <(find qa-public/tests -maxdepth 1 -type f -name '*.test.js' | sort)
          python -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/quadlud-public-qa-http.log" 2>&1 &
          qa_http_pid=$!
          trap 'kill "$qa_http_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null; then break; fi
            if (( attempt == 20 )); then
              cat "$RUNNER_TEMP/quadlud-public-qa-http.log"
              exit 1
            fi
            sleep 0.25
          done
          while IFS= read -r test; do
            echo "PUBLIC QA PY: $test"
            python "$test"
          done < <(find qa-public/tests -maxdepth 1 -type f -name '*.test.py' | sort)
          kill "$qa_http_pid"
          wait "$qa_http_pid" 2>/dev/null || true
          trap - EXIT

      - name: Build Pages payload from runtime only
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/quadlud-pages"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          rsync -a ./ "$PAYLOAD/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='qa-release/' \
            --exclude='LICENSE'
          test -f "$PAYLOAD/index.html"
          test ! -e "$PAYLOAD/qa-public"
          test ! -e "$PAYLOAD/qa-release"
          test ! -e "$PAYLOAD/.github"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload runtime-only static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/quadlud-pages

      - name: Deploy pre-production
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed candidate and launch smoke
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          python - <<'PY'
          import json, os, time, urllib.request
          from playwright.sync_api import sync_playwright

          base = os.environ['PAGE_URL']
          if not base.endswith('/'):
              base += '/'
          expected = json.load(open('build-info.json', encoding='utf-8'))
          last_error = None
          for _ in range(20):
              try:
                  req = urllib.request.Request(base + 'build-info.json', headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      remote = json.loads(r.read().decode('utf-8'))
                      last_modified = r.headers.get('Last-Modified')
                  assert remote.get('version') == expected.get('version'), (remote, expected)
                  assert remote.get('candidate') == expected.get('candidate'), (remote, expected)
                  assert remote.get('channel') == 'Quadlud-test', remote
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(3)
          else:
              raise AssertionError(f'deployed build-info not ready: {last_error}')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={'width':390,'height':844})
              errors=[]
              page.on('pageerror', lambda e: errors.append(str(e)))
              response = page.goto(base, wait_until='networkidle', timeout=60000)
              assert response and response.ok, response.status if response else None
              page.wait_for_function(
                  "expected => { const el=document.querySelector('#testBuildId'); return !!el && el.textContent.includes(expected); }",
                  arg=expected['candidate'],
                  timeout=20000,
              )
              identity = page.locator('#testBuildId').inner_text()
              assert expected['version'] in identity, identity
              assert expected['candidate'] in identity, identity
              assert 'publié' in identity, identity
              assert page.locator('#homeBtn').count() == 1
              assert not errors, errors
              print('DEPLOYED_SMOKE_PASS', base, identity, 'last-modified=', last_modified)
              browser.close()
          PY

      - name: Publish QA handoff marker
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const marker = status === 'success' ? 'QA_PUBLIC_PASS' : 'QA_PUBLIC_RESUME_REQUIRED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `<!-- QUADLUD_QA_HANDOFF -->`,
              `**${marker}**`,
              `- public_sha: \`${context.sha}\``,
              `- run_id: \`${context.runId}\``,
              `- run_attempt: \`${context.runAttempt}\``,
              `- status: **${status}**`,
              `- run: ${runUrl}`,
              status === 'success'
                ? '- next: pre-production deployed and launch-smoked; continue with required human/remaining release gates.'
                : '- next: inspect this public QA run, resume from the latest private checkpoint, correct only the proven failure, export a new public candidate, and rerun.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body
            });
