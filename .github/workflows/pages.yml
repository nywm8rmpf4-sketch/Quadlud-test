name: Deploy QUADLUD human-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  u10-geometry:
    name: U10 Tango Tutor relation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable U10 candidate
        uses: actions/checkout@v4
        with:
          ref: 7611aafee2fffe51513464bbad9ee1b0d2db7e5e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Static delivery and ownership guards
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          css=Path('ui-mobile-coach-fixes.css').read_text(encoding='utf-8')
          core=Path('styles-core.css').read_text(encoding='utf-8')
          pedagogy=Path('styles-pedagogy.css').read_text(encoding='utf-8')
          tango=Path('tango-ui.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'ui-mobile-coach-fixes.css?v=3.1.8-u10' in index
          assert "const CACHE='quadlud-v3.1.8-u10-tango-relation-delivery'" in sw
          assert "'./ui-mobile-coach-fixes.css?v=3.1.8-u10'" in sw
          assert "className:'walkthrough-board-wrap board-wrap grid-coordinate-wrap tango-coordinate-wrap'" in tango
          assert "classes=['cell','walkthrough-cell']" in tango
          assert '.walkthrough-board .cell>*{position:relative;z-index:2}' in pedagogy
          assert '.relation.r{right:-11px;top:50%;transform:translateY(-50%)}' in core
          assert '.relation.d{bottom:-11px;left:50%;transform:translateX(-50%)}' in core
          assert '.tango-coordinate-wrap .cell>.relation{' in css
          assert 'position:absolute!important;' in css
          assert '.relation.r{' not in css and '.relation.d{' not in css
          print('U10 static guards: PASS')
          PY
      - name: Install Chromium and WebKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium webkit
      - name: Measure real Tutor-cell CSS in Chromium and WebKit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          from playwright.sync_api import sync_playwright
          index=Path('index.html').read_text(encoding='utf-8')
          styles=re.findall(r'<link rel="stylesheet" href="([^"?]+)(?:\?[^\"]*)?"',index)
          css='\n'.join(Path(name).read_text(encoding='utf-8') for name in styles)
          game_cells=''.join('<div class="cell" data-r="%d" data-c="%d">%s</div>'%(r,c,'<span class="relation r">=</span><span class="relation d">×</span>' if (r,c)==(1,1) else '') for r in range(6) for c in range(6))
          tutor_cells=''.join('<div class="cell walkthrough-cell" data-r="%d" data-c="%d">%s</div>'%(r,c,'<span class="relation r">=</span><span class="relation d">×</span>' if (r,c)==(1,1) else '') for r in range(6) for c in range(6))
          html=f'''<!doctype html><meta charset="utf-8"><div id="game" class="board-wrap grid-coordinate-wrap tango-coordinate-wrap"><div class="board" id="tboard" style="width:330px;height:330px;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))">{game_cells}</div></div><div id="tutor" class="walkthrough-board-wrap board-wrap grid-coordinate-wrap tango-coordinate-wrap"><div class="board walkthrough-board" data-tango-tutor="readonly" style="width:330px;height:330px;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))">{tutor_cells}</div></div>'''
          def geometry(page,selector):
              return page.eval_on_selector_all(selector+' .relation','''els=>els.map(el=>{const c=el.parentElement,e=el.getBoundingClientRect(),r=c.getBoundingClientRect(),d=el.classList.contains('r')?'r':'d',x=e.left+e.width/2,y=e.top+e.height/2;return {dir:d,symbol:el.textContent.trim(),position:getComputedStyle(el).position,x:(x-r.left)/r.width,y:(y-r.top)/r.height}}).sort((a,b)=>a.dir.localeCompare(b.dir))''')
          def validate(label,g,t):
              assert len(g)==len(t)==2,(label,g,t)
              for surface,rels in [('game',g),('Tutor',t)]:
                  for rel in rels:
                      assert rel['position']=='absolute',(label,surface,rel)
                      ex,ey=((1.0,.5) if rel['dir']=='r' else (.5,1.0))
                      assert abs(rel['x']-ex)<=.05 and abs(rel['y']-ey)<=.05,(label,surface,rel,(ex,ey))
              for a,b in zip(g,t):
                  assert a['dir']==b['dir'] and a['symbol']==b['symbol']
                  assert abs(a['x']-b['x'])<=.02 and abs(a['y']-b['y'])<=.02,(label,a,b)
          with sync_playwright() as p:
              for engine_name,engine in [('chromium',p.chromium),('webkit',p.webkit)]:
                  browser=engine.launch(headless=True)
                  for viewport in ({'width':390,'height':844},{'width':844,'height':390}):
                      page=browser.new_page(viewport=viewport)
                      page.set_content(html)
                      page.add_style_tag(content=css)
                      validate(f"{engine_name} {viewport['width']}x{viewport['height']}",geometry(page,'#game'),geometry(page,'#tutor'))
                      page.close()
                  browser.close()
          print('U10 Tango game/Tutor geometry: PASS Chromium+WebKit portrait+landscape')
          PY

  deploy:
    needs: u10-geometry
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current human-test source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
