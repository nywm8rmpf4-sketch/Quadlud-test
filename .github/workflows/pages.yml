name: QUADLUD public QA + pre-production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quadlud-test-preprod
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@v4

      - name: Enforce public/private boundary
        run: python3 qa-public/tests/public_runtime_guard.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"
          rm -rf "$QA_ROOT"
          mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/tests"
          rsync -a ./ "$QA_ROOT/GitHub/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/tests/"
          test -f "$QA_ROOT/GitHub/index.html"
          test -f "$QA_ROOT/tests/v318-u10-tango-relation-delivery.test.py"

      - name: Check runtime JavaScript syntax
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/quadlud-public-qa/GitHub" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run public static QA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          PYTHONPATH="$PWD/tests" python tests/v318-u10-tango-relation-delivery.test.py

      - name: Run public browser QA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          PYTHONPATH="$PWD/tests" python tests/v315-generic-buttons-browser.test.py

      - name: Build Pages payload from runtime only
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/quadlud-pages"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          rsync -a ./ "$PAYLOAD/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='LICENSE'
          test -f "$PAYLOAD/index.html"
          test ! -e "$PAYLOAD/qa-public"
          test ! -e "$PAYLOAD/.github"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload runtime-only static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/quadlud-pages

      - name: Deploy pre-production
        id: deployment
        uses: actions/deploy-pages@v4
