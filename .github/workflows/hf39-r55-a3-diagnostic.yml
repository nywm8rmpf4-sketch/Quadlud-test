name: HF3.9-R5.5 A3 proof diagnostic

on:
  push:
    branches: [diagnostic/hf39-r55-a3-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-a3-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Chromium QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Search deterministic Expert candidates
        run: |
          set -euo pipefail
          START=$(( ${{ matrix.shard }} * 80 ))
          export PYTHONPATH="$PWD/qa-public/tests"
          python3 qa-public/tests/v319-hf39-r55-a3-proof-search-browser.test.py \
            --start "$START" --count 80 --out "$RUNNER_TEMP/hf39-r55-a3-search"
      - name: Upload diagnostic search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf39-r55-a3-search-${{ matrix.shard }}
          path: ${{ runner.temp }}/hf39-r55-a3-search
          if-no-files-found: warn
          retention-days: 7
