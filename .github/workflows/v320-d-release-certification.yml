name: QUADLUD v3.2.0 release certification
on:
  push:
    branches: ['candidate/v3.2.0-certification-*']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quadlud-v320-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install browser QA
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/q";mkdir -p "$Q/GitHub" "$Q/tests"
          rsync -a ./ "$Q/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$Q/tests/"
      - name: Architecture and portable data gates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          node tests/v320-d-architecture-gate.test.js
          node tests/data-serialization.test.js
          node tests/sound-audio-service.test.js
      - name: UX1 UX2 UX3 exact-runtime gates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          PYTHONPATH="$PWD/tests" python tests/v320-a-victory-insight-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v320-b-progression-profile-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v320-c-portability-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v320-d-local-unavailable-browser.test.py
      - name: Victory Coach Tutor Undo UI accessibility regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          PYTHONPATH="$PWD/tests" python tests/v318-f1-victory-review-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v319-g-accessibility-performance-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/v318-u14-ui-coherence-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/stage26-launch-victory-browser.test.py
      - name: Daily and sound regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          PYTHONPATH="$PWD/tests" python tests/daily-v223-browser.test.py
          PYTHONPATH="$PWD/tests" python tests/sound-audio-browser.test.py
      - name: Five-game runtime smoke
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/q"
          python -m http.server 8765 --directory GitHub >/tmp/quadlud-v320-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep .25; done
          PYTHONPATH="$PWD/tests" QUADLUD_R8_BASE_URL=http://127.0.0.1:8765/ python tests/v319-shared-games-smoke-browser.test.py
      - name: Public runtime guard
        run: PYTHONPATH=qa-public/tests python qa-public/tests/public_runtime_guard.py
      - name: Freeze re-extract and byte identity
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > /tmp/runtime-files.txt
          tar -cf /tmp/quadlud-v3.2.0-runtime.tar -T /tmp/runtime-files.txt
          mkdir -p /tmp/reextract && tar -xf /tmp/quadlud-v3.2.0-runtime.tar -C /tmp/reextract
          while IFS= read -r f; do cmp -- "$f" "/tmp/reextract/$f"; done < /tmp/runtime-files.txt
          sha256sum /tmp/quadlud-v3.2.0-runtime.tar | tee /tmp/quadlud-v3.2.0-runtime.sha256
          echo "RUNTIME_FILES=$(wc -l < /tmp/runtime-files.txt)"
          echo "BYTE_IDENTITY=PASS"
