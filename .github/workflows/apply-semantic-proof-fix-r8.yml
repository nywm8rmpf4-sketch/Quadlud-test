name: Apply reviewed Tango R8 semantic proof corrections

on:
  push:
    branches:
      - qa/tango-tutor-cache-exact-r8
    paths:
      - .github/workflows/apply-semantic-proof-fix-r8.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: qa/tango-tutor-cache-exact-r8

      - name: Apply reviewed patch
        run: python3 qa-public/tools/apply_semantic_proof_fix_r8.py

      - name: Check patch structure
        run: git diff --check

      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"
          mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/tests"
          rsync -a ./ "$QA_ROOT/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='qa-public/' --exclude='qa-release/' --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/tests/"

      - name: Run targeted semantic regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          node tests/v319-r3ui-tango-tutor-clarity.test.js
          node tests/v319-hf39-r55-causal-atomic-contract.test.js

      - name: Commit reviewed patch
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/apply-semantic-proof-fix-r8.yml qa-public/tools/apply_semantic_proof_fix_r8.py
          git add tango-tutor-clarity.js tango-tutor-causal-atomic-r55.js qa-public/tests/v319-r3ui-tango-tutor-clarity.test.js qa-public/tests/v319-hf39-r55-causal-atomic-contract.test.js
          git diff --cached --check
          git commit -m 'fix(tango): compact exact R8 domain proofs after semantic review'
          git push origin HEAD:qa/tango-tutor-cache-exact-r8
