name: QUADLUD Tango R8 sharded cache stage

on:
  push:
    branches:
      - candidate/v3.1.9-tango-r8-sharded-cache-r1
    paths:
      - 'qa-public/tools/shard_tango_tutor_cache_r8.js'
      - 'qa-public/tools/apply_tango_r8_sharded_cache_r1.js'
      - 'qa-public/tests/v319-r8-sharded-cache-roundtrip.test.js'
      - 'qa-public/tests/v319-r8-sharded-cache-browser.test.py'
      - '.github/workflows/tango-r8-sharded-cache-stage.yml'

permissions:
  contents: write

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-sharded-cache-r1
          fetch-depth: 0
      - name: Verify certified source baseline
        run: |
          set -euo pipefail
          test "$(sha256sum tango-tutor-cache-data-r8.js | cut -d' ' -f1)" = "b3a1645d7c582ebc1817967d63a52dea3f594bb68b389bda12aac391267986f8"
          grep -q '61749a9d20f1dda8c2747e4129a480bc74323fb27dc9c84e8fd8ab49227b6c3c' tango-tutor-cache-contract-r8.js
      - name: Verify QA tool syntax
        run: |
          set -euo pipefail
          node --check qa-public/tools/shard_tango_tutor_cache_r8.js
          node --check qa-public/tools/apply_tango_r8_sharded_cache_r1.js
          node --check qa-public/tests/v319-r8-sharded-cache-roundtrip.test.js
          python -m py_compile qa-public/tests/v319-r8-sharded-cache-browser.test.py
      - name: Apply once or verify installed sharded runtime
        run: |
          set -euo pipefail
          if grep -Fq "tango-tutor-cache-r8-sync5-cognitive-sharded-lz4" tango-tutor-precomputed-cache.js; then
            echo "Sharded runtime already installed; verifying deterministic generated files"
            tmp="$(mktemp -d)"
            node qa-public/tools/shard_tango_tutor_cache_r8.js tango-tutor-cache-data-r8.js "$tmp"
            for d in easy medium hard expert; do
              test -s "tango-tutor-cache-r8-$d.js"
              test "$(wc -c < "tango-tutor-cache-r8-$d.js")" -lt 1000000
              cmp "tango-tutor-cache-r8-$d.js" "$tmp/tango-tutor-cache-r8-$d.js"
            done
            cmp tango-tutor-cache-r8-shards-report.json "$tmp/tango-tutor-cache-r8-shards-report.json"
          else
            echo "Installing sharded runtime from certified sync4 baseline"
            node qa-public/tools/apply_tango_r8_sharded_cache_r1.js .
            node qa-public/tools/shard_tango_tutor_cache_r8.js tango-tutor-cache-data-r8.js .
            for d in easy medium hard expert; do
              test -s "tango-tutor-cache-r8-$d.js"
              test "$(wc -c < "tango-tutor-cache-r8-$d.js")" -lt 1000000
            done
          fi
      - name: Run lossless and cognitive regressions
        run: |
          set -euo pipefail
          node qa-public/tests/v319-r8-sharded-cache-roundtrip.test.js
          node qa-public/tests/v319-cognitive-cost-model.test.js
          node qa-public/tests/v319-tango-cognitive-patterns.test.js
          node qa-public/tests/v319-tango-cognitive-plan-ranking.test.js
          node qa-public/tests/v319-cognitive-engine-proof-retention.test.js
          node qa-public/tests/v319-cognitive-no-speculative-contradiction.test.js
          node qa-public/tests/v319-tango-cognitive-proof-stage-compaction.test.js
          node qa-public/tests/v319-r8-simple-before-contradiction.test.js
          node qa-public/tests/v319-r8-cache-materialized-hit.test.js
          node qa-public/tests/v319-r8-direct-visible-fastpath.test.js
          node qa-public/tests/v319-r8-relation-frontier-fastpath.test.js
      - name: Stage generated runtime atomically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js build-info.json game-manifest.js index.html sw.js tango-tutor-precomputed-cache.js \
            tango-tutor-cache-r8-easy.js tango-tutor-cache-r8-medium.js tango-tutor-cache-r8-hard.js tango-tutor-cache-r8-expert.js \
            tango-tutor-cache-r8-shards-report.json
          git diff --cached --check
          git diff --cached --quiet && { echo "No generated runtime changes"; exit 0; }
          git commit -m "build(tango): stage R8 difficulty-sharded Tutor cache"
          git push origin HEAD:candidate/v3.1.9-tango-r8-sharded-cache-r1
