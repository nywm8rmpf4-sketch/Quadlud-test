name: QUADLUD Tango R8 certified cache integration v2
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths: ['.github/workflows/tango-r8-integrate-certified-cache-v2.yml']
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: candidate/v3.1.9-tango-r8-integrated}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: tango-r8-final-exhaustive-parity-evidence
          path: ${{ runner.temp }}/evidence
          github-token: ${{ github.token }}
          repository: nywm8rmpf4-sketch/Quadlud-test
          run-id: 34527490382
      - name: Overlay only exact certified product files
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/evidence/package"
          test "$(sha256sum "$P/tango-runtime-pool-data.js"|cut -d' ' -f1)" = 6c3b226cc4c4db089768740510113bd07db2958a14216cf98020e7b0f4f9b013
          test "$(sha256sum "$P/tango-tutor-precomputed-cache.js"|cut -d' ' -f1)" = 6e367a790eab7cabf4c240606f7f5f6537c5026b33b432bebdcf336a5be6973b
          test "$(sha256sum "$P/tango-tutor-cache-contract-r8.js"|cut -d' ' -f1)" = 2939bf083ea6b694160f57f4a9d89281b04f103f48d402e837863ffb0fea3d6d
          test "$(sha256sum "$P/tango-tutor-cache-data-r8.js"|cut -d' ' -f1)" = d8cbd1c118ba924397bfd579170456a35f2d46dcb581f2b239b315f149acfcbb
          cp "$P/tango-tutor-precomputed-cache.js" tango-tutor-precomputed-cache.js
          cp "$P/tango-tutor-cache-contract-r8.js" tango-tutor-cache-contract-r8.js
          cp "$P/tango-tutor-cache-data-r8.js" tango-tutor-cache-data-r8.js
          node --check tango-tutor-precomputed-cache.js
          node --check tango-tutor-cache-contract-r8.js
          node --check tango-tutor-cache-data-r8.js
      - name: Wire exact cache into index and service worker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          for old,new in {
            'tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof':'tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d',
            'tango-human-cost-bridge.js?v=3.1.9-r3ui-local-proof-hf3r1':'tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5',
            'tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r1':'tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract'
          }.items():
            if s.count(old)!=1: raise SystemExit('index anchor mismatch '+old)
            s=s.replace(old,new)
          old='<script src="tango-tutor-precomputed-cache.js?v=3.1.9-r8-exact"></script><script src="tango-tutor-cache-data-r8.js?v=3.1.9-r8-exact"></script>'
          new='<script src="tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d"></script><script src="tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync2-7d"></script><script src="tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync2-7d"></script>'
          if s.count(old)!=1: raise SystemExit('index cache anchor mismatch')
          p.write_text(s.replace(old,new))
          p=Path('sw.js'); s=p.read_text()
          old="const CACHE='quadlud-v3.1.9-tango-r8-exact-v17';"; new="const CACHE='quadlud-v3.1.9-tango-r8-sync2-7d-v18';"
          if s.count(old)!=1: raise SystemExit('SW cache anchor mismatch')
          s=s.replace(old,new)
          for old,new in {
            './tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof':'./tango-played-move-runtime.js?v=3.1.9-a13r6-single-proof-7d',
            './tango-human-cost-bridge.js?v=3.1.9-r3ui-local-proof-hf3r1':'./tango-human-cost-bridge.js?v=3.1.9-r3ui-human-cost-7d-v5',
            './tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r1':'./tango-human-pedagogy-r4.js?v=3.1.9-r3ui-human-r4-hf3r2-contract'
          }.items():
            if s.count(old)!=1: raise SystemExit('SW query anchor mismatch '+old)
            s=s.replace(old,new)
          old="'./tango-tutor-precomputed-cache.js?v=3.1.9-r8-exact','./tango-tutor-cache-data-r8.js?v=3.1.9-r8-exact'"
          new="'./tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d','./tango-tutor-precomputed-cache.js?v=3.1.9-r8-sync2-7d','./tango-tutor-cache-data-r8.js?v=3.1.9-r8-sync2-7d'"
          if s.count(old)!=1: raise SystemExit('SW cache scripts anchor mismatch')
          p.write_text(s.replace(old,new))
          p=Path('qa-public/tests/v319-r8-integrated-browser.test.py'); s=p.read_text()
          old='quadlud-v3.1.9-tango-r8-exact-v17'; new='quadlud-v3.1.9-tango-r8-sync2-7d-v18'
          if s.count(old)!=1: raise SystemExit('browser expectation anchor mismatch')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Validate source cache and focused regressions
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert=require('assert'),C=require('./tango-tutor-precomputed-cache.js'),D=require('./tango-tutor-cache-data-r8.js');
          if(!C.info().registered)C.registerData(D);const i=C.info();
          assert.equal(i.version,3);assert.equal(i.dataSchema,8);assert.equal(i.dataVersion,'tango-tutor-cache-r8-sync2');
          assert.equal(i.contract.digest,'b48da5bd09ae47acffa1ba787fe26e11c4c3e4830115b931392c6e9fa2e9c45a');
          assert.deepStrictEqual(D.puzzleCounts,{easy:120,medium:120,hard:120,expert:120});
          assert.equal(Object.values(D.steps).reduce((n,x)=>n+x.length,0),14861);
          console.log('PASS exact synchronized cache',i.steps);
          NODE
          R="$RUNNER_TEMP/q"; mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          cd "$R"
          node tests/v319-r3ui-tango-derived-relation-human-cost.test.js
          node tests/v319-r8-simple-before-contradiction.test.js
          node tests/v319-r3ui-tango-tutor-single-planner-owner.test.js
          QUADLUD_PARITY_DIFFICULTY=easy QUADLUD_PARITY_START=0 QUADLUD_PARITY_COUNT=3 node tests/v319-r8-cache-live-parity.test.js
      - name: Audit PWA and commit product changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('sw.js').read_text(); m=re.search(r'const ASSETS=\[(.*?)\];',s,re.S)
          if not m: raise SystemExit('SW ASSETS missing')
          a=re.findall(r"'([^']+)'",m.group(1))
          if len(a)!=len(set(a)): raise SystemExit('duplicate SW assets')
          if './tango-tutor-cache-contract-r8.js?v=3.1.9-r8-sync2-7d' not in a: raise SystemExit('contract not precached')
          print('PASS SW assets',len(a))
          PY
          test "$(sha256sum tango-tutor-precomputed-cache.js|cut -d' ' -f1)" = 6e367a790eab7cabf4c240606f7f5f6537c5026b33b432bebdcf336a5be6973b
          test "$(sha256sum tango-tutor-cache-contract-r8.js|cut -d' ' -f1)" = 2939bf083ea6b694160f57f4a9d89281b04f103f48d402e837863ffb0fea3d6d
          test "$(sha256sum tango-tutor-cache-data-r8.js|cut -d' ' -f1)" = d8cbd1c118ba924397bfd579170456a35f2d46dcb581f2b239b315f149acfcbb
          git config user.name 'QUADLUD QA Bot'; git config user.email 'actions@users.noreply.github.com'
          git add tango-tutor-precomputed-cache.js tango-tutor-cache-contract-r8.js tango-tutor-cache-data-r8.js index.html sw.js qa-public/tests/v319-r8-integrated-browser.test.py
          git diff --cached --check
          git commit -m 'feat(tango): integrate certified synchronized R8 Tutor cache'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
