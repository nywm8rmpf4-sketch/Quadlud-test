name: QUADLUD v3.1.9-F Rectangles and Mosaic victory QA
on:
  push:
    branches: [candidate/v3.1.9-f-rectangles-mosaic]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quadlud-v319-f-rectangles-mosaic
  cancel-in-progress: true
jobs:
  victory-f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Install browser QA
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          Q="$RUNNER_TEMP/q";mkdir -p "$Q/GitHub" "$Q/tests"
          rsync -a ./ "$Q/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$Q/tests/"
      - name: Syntax and focused contracts
        run: |
          set -euo pipefail
          node --check victory-presentation.js
          cd "$RUNNER_TEMP/q"
          node tests/v318-f1-victory-presentation.test.js
          node tests/v319-f-rectangles-mosaic-victory-contract.test.js
          node tests/v319-c-snd3-product-integration.test.js
      - name: Rectangles and Mosaïque mobile matrix
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v319-f-rectangles-mosaic-victory-browser.test.py
      - name: Five-game post-victory review regression
        run: cd "$RUNNER_TEMP/q" && PYTHONPATH="$PWD/tests" python tests/v318-f1-victory-review-browser.test.py
