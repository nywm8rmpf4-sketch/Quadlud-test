name: QUADLUD candidate public QA

on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quadlud-candidate-public-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@v4

      - name: Enforce public/private boundary
        run: python3 qa-public/tests/public_runtime_guard.py

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install browser QA environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Materialize canonical QA layout
        run: |
          set -euo pipefail
          QA_ROOT="$RUNNER_TEMP/quadlud-public-qa"
          rm -rf "$QA_ROOT"
          mkdir -p "$QA_ROOT/GitHub" "$QA_ROOT/tests" "$QA_ROOT/tools"
          rsync -a ./ "$QA_ROOT/GitHub/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='qa-public/' \
            --exclude='qa-release/' \
            --exclude='LICENSE'
          cp -a qa-public/tests/. "$QA_ROOT/tests/"
          cp -a qa-public/tools/. "$QA_ROOT/tools/"
          test -f "$QA_ROOT/GitHub/index.html"
          test -f "$QA_ROOT/tools/tango_tutor_cache_contract.js"

      - name: Check current runtime and QA syntax
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/quadlud-public-qa/GitHub" -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check "$RUNNER_TEMP/quadlud-public-qa/tests/v319-r8-sync-static-contract.test.js"
          node --check "$RUNNER_TEMP/quadlud-public-qa/tests/v319-r8-sync-cache-hit-contract.test.js"
          node --check "$RUNNER_TEMP/quadlud-public-qa/tools/tango_tutor_cache_contract.js"

      - name: Gate synchronized R8 cache and Tutor contracts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          tests=(
            v319-r8-sync-static-contract.test.js
            v319-r8-sync-cache-hit-contract.test.js
            v319-r8-simple-before-contradiction.test.js
            v319-r3ui-tango-tutor-freeze-guard.test.js
            v319-r3ui-tango-attention-fast-frontier.test.js
            v319-r5-frontier-validation-cache.test.js
            v319-hf36-human-next-move-policy.test.js
            v319-r5-tutor-action-atomicity.test.js
            v319-r3ui-tango-text-finalizer.test.js
            v319-hf39-semantic-coherence.test.js
          )
          for test in "${tests[@]}"; do
            echo "CURRENT R8 QA: tests/$test"
            node "tests/$test"
          done

      - name: Gate shared runtime regressions
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          node tests/stage27-generic-session-orchestration.test.js
          node tests/v318-f1-victory-presentation.test.js

      - name: Gate integrated R8 browser journey
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/tests"
          timeout 20m python tests/v319-r8-integrated-browser.test.py

      - name: Gate semantic Tango Tutor journey
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/tests"
          timeout 25m python tests/v319-semantic-tango-tutor-journey-browser.test.py

      - name: Gate shared-game Tutor smoke tests
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quadlud-public-qa"
          export PYTHONPATH="$PWD/tests"
          timeout 15m python tests/stage32-nonogram-tutor-browser.test.py
          timeout 15m python tests/sudoku-tutor-browser.test.py
