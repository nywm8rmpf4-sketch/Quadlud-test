name: QUADLUD public-runner private-source access probe

on:
  push:
    paths:
      - '.github/workflows/private-source-read-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe private master read access without exposing content
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/nywm8rmpf4-sketch/Quadlud/contents/GitHub/build-info.json?ref=9ee9d0dfd6fad0dfa3ce4295d98e4342de4c1b73)"
          echo "private_master_http_status=$code"
          test "$code" = "200"
