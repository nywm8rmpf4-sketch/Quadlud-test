name: QUADLUD fix service-worker duplicate precache URLs
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths: ['.github/workflows/fix-sw-precache-duplicates.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Remove only confirmed duplicate precache URLs and bump cache identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text()
          old="const CACHE='quadlud-v3.1.9-tango-r8-exact-v14';"
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,"const CACHE='quadlud-v3.1.9-tango-r8-exact-v15';")
          gen="'./nonogram-difficulty.js?v=3.1.8','./nonogram-generator.js?v=3.1.8','./nonogram-ui.js?v=3.1.8-u13-nonogram'"
          assert s.count(gen)==1, s.count(gen)
          s=s.replace(gen,"'./nonogram-difficulty.js?v=3.1.8','./nonogram-ui.js?v=3.1.8-u13-nonogram'")
          run="'./nonogram-ui.js?v=3.1.8-u13-nonogram','./nonogram-runtime.js?v=3.1.8','./nonogram-pedagogy.js?v=3.1.8-u13-nonogram'"
          assert s.count(run)==1, s.count(run)
          s=s.replace(run,"'./nonogram-ui.js?v=3.1.8-u13-nonogram','./nonogram-pedagogy.js?v=3.1.8-u13-nonogram'")
          p.write_text(s)
          for t in Path('qa-public/tests').glob('*'):
              if t.is_file() and t.suffix in {'.js','.py'}:
                  x=t.read_text()
                  if 'quadlud-v3.1.9-tango-r8-exact-v14' in x:
                      t.write_text(x.replace('quadlud-v3.1.9-tango-r8-exact-v14','quadlud-v3.1.9-tango-r8-exact-v15'))
          PY
          git diff --check
      - name: Prove precache uniqueness
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('sw.js','utf8'),m=src.match(/const ASSETS=(\[[\s\S]*?\]);/);
          if(!m)throw new Error('ASSETS missing');const a=vm.runInNewContext(m[1]),c=new Map();for(const x of a)c.set(x,(c.get(x)||0)+1);
          const d=[...c].filter(([,n])=>n>1);console.log(JSON.stringify({assetCount:a.length,uniqueCount:c.size,duplicates:d},null,2));
          if(d.length||a.length!==c.size)process.exit(2);
          if(!src.includes("const CACHE='quadlud-v3.1.9-tango-r8-exact-v15'"))process.exit(3);
          NODE
      - name: Run static delivery guards
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/qa"; mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          cd "$R"
          node tests/v319-r8-integrated-runtime.test.js
          node tests/v319-r3ui-tango-contradiction-visual-integration.test.js
          node tests/v319-r3ui-pedagogy-visual-hierarchy.test.js
      - name: Commit proven service-worker correction
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sw.js qa-public/tests
          git diff --cached --check
          git commit -m 'fix(pwa): remove duplicate precache URLs for R8 candidate'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
