name: QUADLUD Tango human proof cost 7D correction
on:
  push:
    branches: [candidate/v3.1.9-tango-r8-integrated]
    paths: ['.github/workflows/tango-r8-human-cost-7d.yml']
permissions:
  contents: write
jobs:
  cost7d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-r8-integrated
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Patch human proof cost bridge to 7D contract
        run: |
          set -euo pipefail
          python3 qa-public/tools/apply_tango_7d_patch.py
          node --check tango-human-cost-bridge.js
          node --check tango-played-move-runtime.js
          node --check qa-public/tests/v319-r3ui-tango-derived-relation-human-cost.test.js
          git diff --check
      - name: Run cost proof and Tutor regressions
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/q"
          mkdir -p "$R/GitHub" "$R/tests"
          rsync -a ./ "$R/GitHub/" --exclude='.git/' --exclude='.github/' --exclude='qa-public/' --exclude='qa-release/'
          cp -a qa-public/tests/. "$R/tests/"
          cd "$R"
          node tests/v319-r3ui-tango-derived-relation-human-cost.test.js
          node tests/v319-r3ui-tango-same-move-proof-minimization.test.js
          node tests/v319-a13r3-tango-relation-path-cost.test.js
          node tests/v319-r8-simple-before-contradiction.test.js
          node tests/v319-r3ui-tango-attention-fast-frontier.test.js
          node tests/v319-r3ui-tango-tutor-freeze-guard.test.js
          node tests/v319-r3ui-tango-tutor-single-planner-owner.test.js
      - name: Rebuild full Easy shard with corrected 7D stack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sync"
          node qa-public/tools/build_tango_tutor_sync_shard_r8.js --difficulty easy --pool tango-runtime-pool-data.js --output "$RUNNER_TEMP/sync/tango-tutor-sync-easy.json" --report "$RUNNER_TEMP/sync/easy-report.json"
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const x=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/sync/tango-tutor-sync-easy.json'));
          assert.equal(x.entries.length,120);
          const steps=x.entries.flatMap(e=>e[2]);
          assert.equal(new Set(steps.map(s=>s[0])).size,steps.length);
          assert(steps.every(s=>Array.isArray(s[9])&&s[9].length>=11));
          console.log('PASS 7D Easy synchronized shard',steps.length,x.tutorContract.digest);
          NODE
      - name: Commit 7D human proof cost correction
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-human-cost-bridge.js tango-played-move-runtime.js qa-public/tests/v319-r3ui-tango-derived-relation-human-cost.test.js
          git diff --cached --check
          git commit -m 'fix(tango): align human proof costs on 7D semantic contract'
          git push origin HEAD:candidate/v3.1.9-tango-r8-integrated
