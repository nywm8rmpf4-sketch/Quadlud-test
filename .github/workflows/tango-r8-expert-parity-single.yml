name: QUADLUD Tango R8 Expert single-puzzle parity

on:
  push:
    branches:
      - candidate/v3.1.9-tango-r8-sharded-cache-r1
    paths:
      - '.github/workflows/tango-r8-expert-parity-single.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MONOLITH_SHA256: 'b3a1645d7c582ebc1817967d63a52dea3f594bb68b389bda12aac391267986f8'
  EXPECTED_CONTRACT_DIGEST: '61749a9d20f1dda8c2747e4129a480bc74323fb27dc9c84e8fd8ab49227b6c3c'
  EXPECTED_RUNTIME_VERSION: 'tango-tutor-cache-r8-sync5-cognitive-sharded-lz4'

jobs:
  expert-single-parity:
    strategy:
      fail-fast: false
      matrix:
        start: [110,111,112,113,114]
    name: expert-single-${{ matrix.start }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Test freshness and exact runtime identity
        run: |
          set -euo pipefail
          test "$(sha256sum tango-tutor-cache-data-r8.js | awk '{print $1}')" = "$EXPECTED_MONOLITH_SHA256"
          grep -q "$EXPECTED_CONTRACT_DIGEST" tango-tutor-cache-contract-r8.js
          grep -Fq "$EXPECTED_RUNTIME_VERSION" tango-tutor-precomputed-cache.js
          grep -Fq 'const VERSION=7' tango-tutor-precomputed-cache.js
          grep -Fq "assert.strictEqual(initial.dataSchema,10)" qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js
          grep -Fq "assert.strictEqual(initial.dataVersion,'tango-tutor-cache-r8-sync5-cognitive-sharded-lz4')" qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js
          test -s tango-tutor-cache-r8-expert.js
      - name: Run exact Expert cache/live parity single puzzle
        env:
          QUADLUD_PARITY_DIFFICULTY: expert
          QUADLUD_PARITY_START: ${{ matrix.start }}
          QUADLUD_PARITY_COUNT: 1
        run: node qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js
