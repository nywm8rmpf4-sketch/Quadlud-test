name: QUADLUD Tango R8 exact-stack parity diagnostic

on:
  push:
    branches: [candidate/v3.1.9-tango-cognitive-chunks-r1]
    paths: ['.github/workflows/tango-r8-cache-isolation-diagnostic.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  expert-single:
    strategy:
      fail-fast: false
      matrix:
        start: [44,45,46,47]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: cognitive-r8-cache-full
          path: certified
          repository: nywm8rmpf4-sketch/Quadlud-test
          run-id: 34607409416
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install exact generated cache from full build
        run: |
          cp certified/tango-tutor-cache-data-r8.js ./tango-tutor-cache-data-r8.js
          cp certified/tango-tutor-cache-contract-r8.js ./tango-tutor-cache-contract-r8.js
      - name: Run one Expert puzzle with exact production Tutor stack
        env:
          QUADLUD_PARITY_DIFFICULTY: expert
          QUADLUD_PARITY_START: ${{ matrix.start }}
          QUADLUD_PARITY_COUNT: '1'
        run: node qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js
