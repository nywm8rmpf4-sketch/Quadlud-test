name: QUADLUD Tango Tutor lean cache R4

on:
  push:
    branches: [qa/tango-tutor-cache-lean-r4]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quadlud-tango-tutor-cache-lean-r4
  cancel-in-progress: true

jobs:
  build-shard:
    strategy:
      fail-fast: false
      matrix:
        difficulty: [easy, medium, hard, expert]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download certified compact 120x4 pool
        uses: actions/download-artifact@v4
        with:
          name: tango-compact-pool-r2
          path: compact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34329271172
      - name: Build and certify lean Tutor cache shard
        run: |
          node qa-public/tools/build_tango_tutor_lean_shard_r4.js \
            --pool compact/tango-diversity-pool.js \
            --difficulty '${{ matrix.difficulty }}' \
            --output 'tango-tutor-cache-${{ matrix.difficulty }}.json' \
            --report 'tango-tutor-cache-${{ matrix.difficulty }}-report.json'
      - name: Record shard integrity
        run: |
          sha256sum 'tango-tutor-cache-${{ matrix.difficulty }}.json' | tee 'tango-tutor-cache-${{ matrix.difficulty }}.sha256'
          cat 'tango-tutor-cache-${{ matrix.difficulty }}-report.json'
      - uses: actions/upload-artifact@v4
        with:
          name: tango-tutor-cache-${{ matrix.difficulty }}-r4
          path: |
            tango-tutor-cache-${{ matrix.difficulty }}.json
            tango-tutor-cache-${{ matrix.difficulty }}.sha256
            tango-tutor-cache-${{ matrix.difficulty }}-report.json
          if-no-files-found: error
          retention-days: 7

  summarize:
    needs: build-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tango-tutor-cache-*-r4
          path: shards
          merge-multiple: true
      - name: Summarize lean cache
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),diffs=['easy','medium','hard','expert'];
          const reports=Object.fromEntries(diffs.map(d=>[d,JSON.parse(fs.readFileSync(path.join('shards',`tango-tutor-cache-${d}-report.json`),'utf8'))]));
          const sum=field=>diffs.reduce((n,d)=>n+reports[d][field],0);
          const fullMs=diffs.reduce((n,d)=>n+reports[d].fullPlannerMs.total,0),targetedMs=diffs.reduce((n,d)=>n+reports[d].targetedRebuildMs.total,0);
          const out={schema:1,version:'tango-tutor-cache-r4-lean',totalBytes:sum('bytes'),cachedSteps:sum('cachedSteps'),uniqueFingerprints:sum('uniqueFingerprints'),directSeeds:sum('directSeeds'),advancedSeeds:sum('advancedSeeds'),bytesPerCachedStep:Number((sum('bytes')/sum('cachedSteps')).toFixed(1)),fullPlannerMs:fullMs,targetedRebuildMs:targetedMs,speedupMean:Number((fullMs/Math.max(0.001,targetedMs)).toFixed(3)),reports};
          fs.writeFileSync('shards/tango-tutor-cache-r4-summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: tango-tutor-cache-r4-complete
          path: shards/
          if-no-files-found: error
          retention-days: 7
