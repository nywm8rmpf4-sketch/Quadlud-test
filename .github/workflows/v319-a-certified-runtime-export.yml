name: QUADLUD v3.1.9-A certified runtime export
on:
  push:
    branches:
      - qa/v319-a-certified-runtime-export-r1
    paths:
      - '.github/workflows/v319-a-certified-runtime-export.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e633e7fbb6ef2ab90a6f8599a2bc3cdf99e24bbf
      - name: Verify immutable runtime reference
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e633e7fbb6ef2ab90a6f8599a2bc3cdf99e24bbf"
          test "$(git hash-object app.js)" = "1c87612c5e6fd0a9c040a8deb11c5855c096e129"
          test "$(git hash-object build-info.json)" = "b4bdc0724f17c832978ddda4b3bb9e9387203484"
          test "$(git hash-object game-manifest.js)" = "9f27f251f256a06d973ec2387e19ffd2aa046e7d"
          test "$(git hash-object index.html)" = "193361655952a3a5c8c7528388141f441eca516d"
          test "$(git hash-object sw.js)" = "313c100a74429fcf0543a06dc2a56aaf726886ec"
          test "$(git hash-object tango-tutor-precomputed-cache.js)" = "0b3e3037c70d45388f62e3d826fba3b5b8cf6a57"
          test "$(git hash-object tango-tutor-cache-r8-easy.js)" = "76513425524a28d78e8d4b4efd10f6701661e83a"
          test "$(git hash-object tango-tutor-cache-r8-medium.js)" = "d4086269189bb7cce862fce76645653ad3ab0f10"
          test "$(git hash-object tango-tutor-cache-r8-hard.js)" = "69cd0eb57d47184413c65afb1a369f34d1b6c63c"
          test "$(git hash-object tango-tutor-cache-r8-expert.js)" = "1ba64ceda32be31d19bed453389652a8746582f7"
      - name: Package exact source checkout
        run: |
          set -euo pipefail
          rm -rf .git
          printf '%s\n' 'e633e7fbb6ef2ab90a6f8599a2bc3cdf99e24bbf' > CERTIFIED_RUNTIME_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quadlud-v319-a-certified-e633-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
