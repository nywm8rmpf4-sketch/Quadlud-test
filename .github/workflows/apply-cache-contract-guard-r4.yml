name: QUADLUD apply Tango exact materialized cache R5

on:
  push:
    branches: [candidate/v3.1.9-tango-cognitive-chunks-r1]
    paths: ['.github/workflows/apply-cache-contract-guard-r4.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/v3.1.9-tango-cognitive-chunks-r1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply exact materialized cache patch
        run: python3 qa-public/tools/apply_tango_cache_materialization_r5.py
      - name: Syntax and focused regression before commit
        run: |
          set -euo pipefail
          node --check tango-tutor-precomputed-cache.js
          node --check qa-public/tools/build_tango_tutor_sync_shard_r8.js
          node --check qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js
          node --check qa-public/tests/v319-r8-cache-materialized-hit.test.js
          node qa-public/tests/v319-r8-cache-materialized-hit.test.js
          node qa-public/tests/v319-r8-cache-planner-contract-guard.test.js
          node qa-public/tests/v319-r3ui-tango-tutor-single-planner-owner.test.js
          node qa-public/tests/v319-r8-cognitive-live-priority.test.js
          node qa-public/tests/v319-r8-simple-before-contradiction.test.js
          mkdir -p /tmp/quadlud-r8
          node qa-public/tools/build_tango_tutor_sync_shard_r8.js --difficulty hard --start 20 --count 5 --output /tmp/quadlud-r8/hard-20-5.json --report /tmp/quadlud-r8/hard-20-5-report.json
          git diff --check
      - name: Commit exact materialized cache runtime
        run: |
          set -euo pipefail
          git config user.name 'QUADLUD QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tango-tutor-precomputed-cache.js qa-public/tools/build_tango_tutor_sync_shard_r8.js qa-public/tests/v319-r8-cognitive-cache-live-parity.test.js qa-public/tests/v319-r8-cache-materialized-hit.test.js
          git commit -m 'fix(tango): materialize exact cached Tutor plan'
          git push origin HEAD:candidate/v3.1.9-tango-cognitive-chunks-r1
